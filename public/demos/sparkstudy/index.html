<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SparkStudy Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.7.2/mammoth.browser.min.js"></script>
<style>
  :root{
    --bg:#f7f7ef;
    --card:#ffffff;
    --ink:#2b2b23;
    --muted:#75756a;
    --accent:#e2613b;
    --accent-dark:#c9502d;
    --green:#3f6b52;
    --green-bg:#dfeade;
    --border:#e7e5da;
    --border-strong:#d8d5c7;
    --shadow: 0 1px 2px rgba(30,25,10,0.04), 0 4px 16px rgba(30,25,10,0.05);
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{ font-family:'Fraunces',Georgia,serif; }
  a{color:inherit;}
  button{font-family:inherit;}
  #app{ display:flex; min-height:100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:250px; flex-shrink:0; background:var(--card);
    border-right:1px solid var(--border);
    padding:22px 18px; display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:4px 8px 22px 8px; }
  .brand .logo{
    width:34px; height:34px; border-radius:9px; background:#f4c453;
    display:flex; align-items:center; justify-content:center; font-size:18px;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.75);
    position:relative;
  }
  .brand .logo:after{ content:""; width:12px; height:12px; border-radius:4px; background:#ff8bbd; box-shadow:10px 8px 0 #62d690, -7px 10px 0 #ffe08a; transform:rotate(45deg); }
  .brand .name{ font-family:'Fraunces',serif; font-weight:700; font-size:19px; }
  nav.nav{ display:flex; flex-direction:column; gap:3px; }
  .nav-item{
    display:flex; align-items:center; gap:0; padding:10px 18px; border-radius:10px;
    cursor:pointer; color:var(--muted); font-weight:600; font-size:14.5px;
    border:1px solid transparent; user-select:none;
  }
  .nav-item:hover{ background:#f2f1e9; }
  .nav-item.active{ background:var(--green-bg); color:var(--green); border-color:#cfe3cb; }
  .nav-item .ic{ display:none; }
  .sidebar-spacer{ flex:1; }
  .demo-pill{
    display:flex; align-items:center; gap:7px; background:#fdf1d8; border:1px solid #f2dfa9;
    color:#8a6a1f; font-size:12.5px; font-weight:600; padding:8px 10px; border-radius:10px; margin-bottom:12px;
  }
  .me-card{
    display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--border);
    border-radius:12px; padding:8px; cursor:pointer;
  }
  .me-card img,.me-card svg{ width:40px; height:40px; border-radius:9px; }
  .me-card .who{ font-weight:700; font-size:14px; }
  .me-card .lvl{ color:var(--muted); font-size:12px; }

  /* ---------- Main ---------- */
  main{ flex:1; padding:38px 46px 60px; max-width:1400px; }
  .eyebrow{ font-size:12px; letter-spacing:.12em; font-weight:700; color:var(--green); text-transform:uppercase; margin-bottom:8px; }
  .page-title{ font-size:44px; margin:0 0 10px; font-weight:700; line-height:1.05; }
  .page-sub{ color:var(--muted); font-size:15.5px; margin:0 0 30px; max-width:640px; }
  .top-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap; }

  .btn{
    display:inline-flex; align-items:center; gap:8px; border:none; cursor:pointer;
    font-weight:700; font-size:14px; padding:12px 18px; border-radius:12px;
    transition:transform .05s ease;
  }
  .btn:active{ transform:scale(0.98); }
  .btn-accent{ background:var(--accent); color:#fff; box-shadow:0 6px 16px rgba(226,97,59,0.28); }
  .btn-accent:hover{ background:var(--accent-dark); }
  .btn-outline{ background:#fff; border:1.5px solid var(--ink); color:var(--ink); }
  .btn-outline:hover{ background:#f2f1e9; }
  .btn-ghost{ background:transparent; color:var(--muted); border:1px solid var(--border); }
  .btn-danger{ background:#fdecec; color:#b3402c; border:1px solid #f3c9c0; }
  .btn-sm{ padding:8px 12px; font-size:13px; border-radius:9px; }

  .card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
  .grid{ display:grid; gap:18px; }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-2{ grid-template-columns:repeat(2,1fr); }
  @media(max-width:1150px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} }
  @media(max-width:760px){ .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;} main{padding:26px 20px;} .sidebar{width:210px;} }

  .stat-card{ padding:22px; position:relative; overflow:hidden; }
  .stat-card.clickable{ cursor:pointer; }
  .stat-card.clickable:hover{ transform:translateY(-1px); }
  .stat-card .icon{ font-size:20px; }
  .stat-card .num{ font-family:'Fraunces',serif; font-size:34px; font-weight:700; margin:14px 0 2px; }
  .stat-card .lbl{ color:var(--muted); font-size:13.5px; font-weight:600; }
  .stat-card .corner{ position:absolute; right:-6px; bottom:-14px; width:60px; height:60px; background:currentColor; opacity:0.12; transform:rotate(20deg); border-radius:10px; }

  .progress-card{ padding:20px 24px; display:flex; align-items:center; gap:16px; margin:22px 0 34px; }
  .progress-card .badge{ width:44px; height:44px; border-radius:12px; background:#f4c453; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
  .progress-card .badge:after{ content:""; width:16px; height:16px; border-radius:5px; background:#3bc47b; box-shadow:9px 8px 0 #ffe08a, -8px 8px 0 #ff8bbd; transform:rotate(45deg); }
  .progress-card .body{ flex:1; }
  .progress-card .head{ display:flex; justify-content:space-between; font-weight:700; margin-bottom:8px; }
  .bar-track{ height:9px; background:#eee9d8; border-radius:6px; overflow:hidden; }
  .bar-fill{ height:100%; background:linear-gradient(90deg,#e2613b,#f0a45a); border-radius:6px; }
  .level-path{ position:relative; display:flex; flex-direction:column; gap:16px; padding:10px 4px 2px; }
  .level-path:before{ content:""; position:absolute; left:31px; top:28px; bottom:28px; width:5px; border-radius:5px; background:#e7e5da; }
  .level-row{ position:relative; display:grid; grid-template-columns:64px 1fr; gap:14px; align-items:center; }
  .level-node{ width:62px; height:62px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',Georgia,serif; font-size:22px; font-weight:800; border:3px solid #d8d5c7; background:#fff; color:var(--muted); z-index:1; box-shadow:var(--shadow); }
  .level-row.complete .level-node{ background:var(--green); border-color:var(--green); color:#fff; }
  .level-row.current .level-node{ background:#f4c453; border-color:var(--ink); color:var(--ink); transform:scale(1.06); }
  .level-row.locked .level-node{ background:#f2f1e9; color:#9a9a8e; }
  .level-card{ padding:14px 16px; border:1px solid var(--border); border-radius:14px; background:#fff; }
  .level-row.current .level-card{ border-color:#f2dfa9; background:#fffaf0; }
  .level-card h3{ margin:0 0 4px; font-size:16px; }
  .level-card p{ margin:0; color:var(--muted); font-size:13px; line-height:1.45; }
  .req-list{ display:flex; gap:7px; flex-wrap:wrap; margin-top:9px; }
  .req-chip{ border:1px solid var(--border); background:#faf9f3; border-radius:20px; padding:4px 9px; font-size:12px; font-weight:700; color:var(--muted); }
  .level-row.complete .req-chip{ background:#e8f1e7; color:var(--green); }
  .level-row.current .req-chip{ background:#fdf1d8; color:#8a6a1f; }

  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin:8px 0 16px; }
  .section-head h2{ font-size:22px; margin:0; }
  .see-all{ font-weight:700; font-size:13.5px; color:var(--ink); text-decoration:none; cursor:pointer; }

  .quick-btn{
    background:#fff; border:1.5px solid var(--ink); border-radius:14px; padding:20px; cursor:pointer;
    display:flex; align-items:center; gap:0; font-weight:700; font-size:15px; text-align:left;
  }
  .quick-btn:hover{ background:#f2f1e9; }
  .quick-btn .ic{ display:none; }

  .subject-card{ padding:18px; position:relative; border-top:4px solid var(--sc,#333); cursor:pointer; }
  .subject-card .top{ display:flex; justify-content:space-between; align-items:flex-start; }
  .subject-card .emoji{ width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:20px; background:color-mix(in srgb, var(--sc,#333) 18%, white); }
  .subject-card h3{ margin:14px 0 4px; font-size:18px; }
  .subject-card .meta{ display:flex; justify-content:space-between; color:var(--muted); font-size:13px; }
  .smart-card{ padding:18px; display:flex; flex-direction:column; gap:12px; }
  .smart-card .smart-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .smart-card .smart-icon{ width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:18px; background:#f2f1e9; }
  .smart-card h3{ margin:0; font-size:17px; }
  .smart-card p{ margin:4px 0 0; color:var(--muted); font-size:13px; line-height:1.45; }
  .subject-toolbar{ display:grid; grid-template-columns:minmax(220px,1fr) 160px 180px; gap:10px; margin:0 0 18px; align-items:center; }
  .content-row{ padding:15px 16px; display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:14px; align-items:center; margin-bottom:10px; cursor:pointer; }
  .content-row:hover{ background:#fffdf8; }
  .content-row .type-dot{ width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:#f2f1e9; font-weight:800; }
  .content-row h3{ margin:0 0 3px; font-size:16px; }
  .content-row p{ margin:0; color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .subject-summary{ display:grid; grid-template-columns:1.1fr .9fr; gap:18px; align-items:stretch; margin-bottom:20px; }
  .subject-hero-card{ padding:22px; display:flex; align-items:center; gap:16px; border-top:4px solid var(--sc,#333); }
  .subject-hero-card .emoji{ width:58px; height:58px; border-radius:15px; display:flex; align-items:center; justify-content:center; font-size:24px; background:color-mix(in srgb, var(--sc,#333) 18%, white); }
  .subject-hero-card h2{ margin:0 0 4px; font-size:25px; }
  .subject-mini-stats{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .subject-mini-stats .mini{ padding:16px; }
  .subject-mini-stats .num{ font-family:'Fraunces',Georgia,serif; font-size:25px; font-weight:800; }
  .kebab{ background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1; padding:2px 6px; border-radius:6px;}
  .kebab:hover{ background:#f2f1e9; }

  .note-card{ padding:20px; cursor:pointer; display:flex; flex-direction:column; gap:10px; }
  .note-card .eyebrow-row{ display:flex; justify-content:space-between; align-items:center; }
  .note-card .eyebrow-row .tag-date{ font-size:11.5px; font-weight:700; letter-spacing:.06em; color:var(--green); text-transform:uppercase; }
  .note-card h3{ margin:0; font-size:17px; }
  .note-card p{ margin:0; color:var(--muted); font-size:13.5px; line-height:1.5; max-height:58px; overflow:hidden; }
  .tagset{ display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
  .tag-pill{ background:#f2f1e9; color:var(--ink); font-size:12px; font-weight:600; padding:4px 10px; border-radius:20px; }
  .pin{ color:#c98a1f; font-size:15px; }

  .search-input, select.select, input.field, textarea.field{
    width:100%; border:1.5px solid var(--border-strong); background:#fff; border-radius:11px;
    padding:12px 14px; font-size:14.5px; font-family:inherit; color:var(--ink);
  }
  .search-input:focus, select.select:focus, input.field:focus, textarea.field:focus{ outline:none; border-color:var(--accent); }
  label.field-label{ font-weight:700; font-size:13px; margin-bottom:6px; display:block; color:var(--ink); }

  .empty-state{ padding:60px 30px; text-align:center; color:var(--muted); }
  .empty-state .big{ font-size:38px; margin-bottom:10px; }

  /* Notes detail */
  .note-detail-body{ line-height:1.8; font-size:15.5px; }
  .note-detail-body ul{ padding-left:20px; margin:0; }
  .note-detail-body li{ margin-bottom:10px; }
  .note-detail-body mark{ background:#fde3b8; padding:0 3px; border-radius:3px; color:#5b3d0f; font-weight:700; }
  .note-passage{ border-radius:10px; padding:2px 4px; outline:2px solid transparent; transition:background .25s ease, outline-color .25s ease, box-shadow .25s ease; }
  .note-passage.link-focus{ background:#fff4c7; outline-color:#f4c453; box-shadow:0 0 0 5px rgba(244,196,83,.18); }
  .note-passage.link-flash{ animation:notePulse 2.6s ease; }
  @keyframes notePulse{ 0%,100%{ background:#fff4c7; } 45%{ background:#dff5e8; } }
  .node-link-icon{ margin-left:6px; color:var(--green); font-size:12px; vertical-align:middle; }
  .study-highlight{ border:0; border-radius:7px; padding:1px 5px; font:inherit; font-weight:800; color:var(--ink); cursor:pointer; line-height:1.7; }
  .study-highlight.fact{ background:#fff1a8; }
  .study-highlight.definition{ background:#dff5e8; color:#236645; }
  .study-highlight.example{ background:#dff1ff; color:#235f82; }
  .study-highlight.warning{ background:#ffe1eb; color:#9b3153; }
  .study-highlight.process{ background:#e8f3d8; color:#4e6f1b; }
  .highlight-toolbar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:10px 0 4px; }
  .toggle-pill{ border:1px solid var(--border); background:#fff; border-radius:999px; padding:7px 11px; font-size:12px; font-weight:900; cursor:pointer; color:var(--muted); }
  .toggle-pill.on{ background:#eaf8f1; color:var(--green); border-color:#aee4c3; }
  .highlight-type-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px; }
  .highlight-type-row button{ border:1px solid var(--border); border-radius:12px; padding:9px; background:#fff; font-weight:900; cursor:pointer; }

  /* Mind map cards */
  .mindmap-card{ padding:20px; cursor:pointer; display:flex; gap:16px; align-items:center; }
  .mindmap-card .ic{ width:52px; height:52px; border-radius:13px; background:#f1e7fb; color:#7a4bb0; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; }
  .mindmap-card h3{ margin:0 0 3px; font-size:17px; }
  .mindmap-card .sub{ color:var(--muted); font-size:13.5px; margin:0 0 6px; }
  .mindmap-card .meta{ display:flex; gap:14px; color:var(--muted); font-size:12.5px; }
  .mindmap-svg-wrap{ background:#fff; border:1px solid var(--border); border-radius:16px; padding:10px; }
  .segmented{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px; }
  .segmented .seg{ border:1px solid var(--border); background:#fff; color:var(--muted); border-radius:20px; padding:7px 12px; font-size:13px; font-weight:800; cursor:pointer; }
  .segmented .seg.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .task-board{ display:grid; grid-template-columns:minmax(0,1fr) 290px; gap:18px; align-items:start; }
  .task-panel{ padding:18px; }
  .quick-add{ display:grid; grid-template-columns:minmax(0,1fr) 150px minmax(230px,.75fr) auto; gap:9px; margin-bottom:16px; align-items:end; }
  .task-row{ padding:15px 16px; display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:flex-start; margin-bottom:10px; position:relative; overflow:hidden; }
  .task-row.done{ opacity:.72; background:#faf9f3; }
  .task-check{ width:25px; height:25px; border-radius:50%; border:2px solid var(--border-strong); background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; font-weight:900; color:#fff; transition:transform .16s ease, background .16s ease; }
  .task-row.done .task-check{ background:var(--green); border-color:var(--green); transform:scale(1.08); }
  .task-main h3{ margin:0 0 4px; font-size:15.5px; }
  .task-row.done .task-main h3{ text-decoration:line-through; color:var(--muted); }
  .task-meta{ display:flex; flex-wrap:wrap; gap:6px; color:var(--muted); font-size:12px; }
  .subtask-list{ margin:8px 0 0; padding-left:18px; color:var(--muted); font-size:12.5px; line-height:1.45; }
  .task-history{ display:flex; flex-direction:column; gap:10px; max-height:320px; overflow:auto; }
  .history-item{ border:1px solid var(--border); border-radius:10px; padding:10px 12px; background:#faf9f3; }
  .history-item .name{ font-weight:800; font-size:13px; margin-bottom:3px; }
  .history-item .meta{ color:var(--muted); font-size:12px; line-height:1.4; }
  .linked-study-list{ margin-top:10px; display:flex; flex-direction:column; gap:7px; }
  .linked-study-row{ border:1px solid var(--border); background:#faf9f3; border-radius:10px; padding:8px 10px; display:flex; justify-content:space-between; gap:10px; align-items:center; font-size:12.5px; cursor:pointer; }
  .linked-study-row:hover{ background:#fff7f2; border-color:#f3c9c0; }
  .linked-study-row .kind{ color:var(--muted); font-weight:800; font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  .linked-study-empty{ color:var(--muted); font-size:12.5px; margin-top:8px; }
  .timer-bar{ position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:50; min-width:min(620px,calc(100vw - 28px)); background:#2b2b23; color:#fff; border-radius:14px; box-shadow:0 14px 38px rgba(0,0,0,.22); padding:12px 14px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; }
  .timer-bar .name{ font-weight:800; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .timer-bar .time{ font-family:'Fraunces',Georgia,serif; font-weight:800; font-size:22px; line-height:1; }
  .timer-bar .mini{ color:#d8d5c7; font-size:12px; margin-top:3px; }
  .timer-bar .actions{ display:flex; gap:7px; flex-wrap:wrap; justify-content:flex-end; }
  .timer-bar button{ border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.08); color:#fff; border-radius:9px; padding:7px 9px; font-weight:800; cursor:pointer; }
  .timer-count{ font-family:'Fraunces',Georgia,serif; font-size:54px; font-weight:800; text-align:center; margin:18px 0 8px; }
  .timer-progress{ height:10px; background:#eee9d8; border-radius:8px; overflow:hidden; margin:12px 0 18px; }
  .timer-progress span{ display:block; height:100%; background:linear-gradient(90deg,#3f6b52,#f0a45a); border-radius:8px; }
  .duration-slider{ border:1.5px solid var(--border-strong); background:#fff; border-radius:13px; padding:10px 12px; }
  .duration-slider .duration-top{ display:flex; justify-content:space-between; gap:10px; align-items:center; margin-bottom:8px; }
  .duration-slider .duration-name{ font-size:12px; font-weight:800; color:var(--muted); }
  .duration-slider .duration-value{ font-size:13px; font-weight:900; color:var(--green); background:#e8f1e7; border-radius:999px; padding:3px 8px; white-space:nowrap; }
  .duration-slider input[type="range"]{ width:100%; height:12px; border-radius:999px; appearance:none; -webkit-appearance:none; background:#eee9d8; cursor:pointer; touch-action:pan-y; }
  .duration-slider input[type="range"]:focus{ outline:2px solid rgba(226,97,59,.28); outline-offset:4px; }
  .duration-slider input[type="range"]::-webkit-slider-thumb{ appearance:none; -webkit-appearance:none; width:24px; height:24px; border-radius:50%; background:#fff; border:3px solid var(--accent); box-shadow:0 4px 12px rgba(43,43,35,.22); }
  .duration-slider input[type="range"]::-moz-range-thumb{ width:20px; height:20px; border-radius:50%; background:#fff; border:3px solid var(--accent); box-shadow:0 4px 12px rgba(43,43,35,.22); }
  .duration-marks{ display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-top:7px; color:var(--muted); font-size:10.5px; font-weight:800; }
  .duration-marks span:not(:first-child){ text-align:center; }
  .duration-marks span:last-child{ text-align:right; }
  .task-progress-ring{ height:10px; background:#eee9d8; border-radius:7px; overflow:hidden; margin-top:10px; }
  .task-progress-ring span{ display:block; height:100%; background:linear-gradient(90deg,var(--green),#f0a45a); border-radius:7px; }
  .streak-card{ position:relative; overflow:hidden; background:linear-gradient(135deg,#fff3d8 0%,#fffaf0 52%,#e8f7de 100%); border:2px solid #f3c15d; box-shadow:0 16px 36px rgba(217,99,39,.14); }

  .catch-star{ position:absolute; z-index:5; width:54px; height:54px; border:0; border-radius:50%; background:linear-gradient(180deg,#ffe889,#f4c453); color:#8a5a16; font-size:32px; line-height:1; cursor:pointer; box-shadow:0 10px 18px rgba(138,90,22,.18); display:flex; align-items:center; justify-content:center; user-select:none; transition:transform .12s ease; pointer-events:auto; touch-action:manipulation; }
  .catch-star:hover{ transform:scale(1.06); }

  .catch-star.fade{ animation:starFade .18s ease forwards; }
  @keyframes starPop{ 0%{ transform:scale(1); opacity:1; } 55%{ transform:scale(1.22); opacity:1; } 100%{ transform:scale(.15); opacity:0; } }
  @keyframes starFade{ from{ transform:scale(1); opacity:1; } to{ transform:scale(.75); opacity:0; } }

function localDateISO(date){
  const d = date ? new Date(date) : new Date();
  if(Number.isNaN(d.getTime())) return localDateISO();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function todayISO(){ return localDateISO(); }
function parseLocalDate(value){
  const [y,m,d] = String(value||todayISO()).split('-').map(Number);
  return new Date(y || new Date().getFullYear(), (m || 1)-1, d || 1);
}
function addLocalDays(value, days){
  const d = parseLocalDate(value);
  d.setDate(d.getDate() + days);
  return localDateISO(d);
}
function daysBetweenLocal(a,b){
  const start = parseLocalDate(a);
  const end = parseLocalDate(b);
  return Math.round((end - start) / 86400000);
}
function displayDate(value){
  if(!value) return 'No due date';
  const d = new Date(value + 'T00:00:00');
  return d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
}
function displayFullDate(value){
  if(!value) return 'No date';
  return parseLocalDate(value).toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
}
function displayDateTime(value){
  if(!value) return 'Not recorded';
  const d = new Date(value);
  return d.toLocaleString(undefined, {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
}
function formatDuration(minutes){
  minutes = Number(minutes||0);
  if(!minutes) return 'No study duration';
  if(minutes < 60) return minutes + ' min';
  const h = Math.floor(minutes/60);
  const m = minutes % 60;
  return h + ' hr' + (m ? ' ' + m + ' min' : '');
}

function clampStudyMinutes(value, fallback){

function detectSubjectFromText(title, text){
  const haystack = (` ${title||''} ${text||''} `).toLowerCase();
  let best = null;
  SUBJECT_RULES.forEach(rule=>{
    let score = 0;
    rule.aliases.forEach(alias=>{
      if(new RegExp(`\\b${alias.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\b`, 'i').test(haystack)) score += 5;
    });
    rule.words.forEach(word=>{
      const re = new RegExp(`\\b${word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\b`, 'gi');
      const matches = haystack.match(re);
      if(matches) score += Math.min(matches.length, 4);
    });
    if(!best || score > best.score) best = {rule, score};
  });
  return best && best.score >= 3 ? {subject:ensureSubjectForRule(best.rule), confidence:best.score} : {subject:getUnsortedSubject(), confidence:0};
}

function streakInfo(){
  const counts = activityByDate(studyActivityEvents());
  const days = Object.keys(counts).sort();
  const today = todayISO();
  let longest = 0, run = 0, prev = null;
  days.forEach(day=>{
    run = prev && daysBetweenLocal(prev, day) === 1 ? run + 1 : 1;
    longest = Math.max(longest, run);
    prev = day;
  });
  let current = 0;
  if(days.length){
    const last = days[days.length-1];
    const gap = daysBetweenLocal(last, today);
    if(gap <= 1){
      current = 1;
      for(let i=days.length-2;i>=0;i--){
        if(daysBetweenLocal(days[i], days[i+1]) === 1) current++;
        else break;
      }
    }
  }
  if(days.length && days[days.length-1] && daysBetweenLocal(days[days.length-1], today) > 1) current = 0;
  const completedToday = !!counts[today];
  const isNewLongest = completedToday && current > 0 && current >= longest && current === longest;
  const message = completedToday ? (isNewLongest && current > 1 ? 'New longest streak!' : 'Your streak is safe for today!') : 'Complete a task today to continue your streak.';
  return {current, longest, completedToday, activeDays:days.length, message, counts};
}

function statsRangeDays(range){
  const today = todayISO();
  if(range==='Last 7 days') return Array.from({length:7},(_,i)=>addLocalDays(today, i-6));
  if(range==='Last 30 days') return Array.from({length:30},(_,i)=>addLocalDays(today, i-29));
  if(range==='This month'){
    const now = new Date();
    const first = localDateISO(new Date(now.getFullYear(), now.getMonth(), 1));
    const len = daysBetweenLocal(first, today) + 1;
    return Array.from({length:len},(_,i)=>addLocalDays(first, i));
  }
  const days = Object.keys(activityByDate(studyActivityEvents())).sort();
  if(!days.length) return [today];
  const len = Math.min(366, daysBetweenLocal(days[0], today) + 1);
  return Array.from({length:len},(_,i)=>addLocalDays(addLocalDays(today, 1-len), i));
}

const STOP_WORDS = new Set(['The','A','An','This','That','These','Those','It','In','On','For','And','But','With','Is','Are','Was','Were','Of','To','As','At','By','If','From','Into','Using','Use','Uses','Used','Main','Also','All']);
const SECTION_DEFS = [
  {kind:'definition', title:'Definitions', test:/\b(is|are|means|refers to|called|defined as)\b/i},
  {kind:'formula', title:'Formulas', test:/\b(formula|equation|equals|plus|minus|divided|squared|reaction|yields|=|\+|-)\b/i},
  {kind:'date', title:'Dates and Timeline', test:/\b(1[5-9]\d{2}|20\d{2}|after|before|began|late|early|century|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday|January|February|March|April|May|June|July|August|September|October|November|December)\b/i},
  {kind:'example', title:'Examples', test:/\b(for example|such as|like|including|e\.g\.)\b/i},
  {kind:'fact', title:'Important Facts', test:/./}
];

function splitSentences(text){
  const chunks = text.split(/\n+/).map(s=>cleanSourceLine(s)).filter(Boolean);
  const sentences = [];
  chunks.forEach(c=>{
    if(isBadNoteFragment(c)) return;
    c.split(/(?<=[.!?])\s+/).forEach(s=>{ if(s.trim()) sentences.push(s.trim()); });
  });
  return sentences.length ? sentences : (text.trim() ? [text.trim()] : []);
}

function cleanSourceLine(line){
  let s = (line||'').replace(/\s+/g,' ').trim();
  s = s.replace(/^[-*•]\s*/,'').replace(/^\(?\d+[\).]\s*$/,'').trim();
  s = s.replace(/\bshown in your notes\b/ig,'').replace(/\byour notes\b/ig,'').replace(/\s+:/g,':').replace(/\s{2,}/g,' ').trim();
  return s;
}

function isBadNoteFragment(text){
  const s = (text||'').trim();
  if(!s) return true;
  if(/^\(?\d+[\).]?$/.test(s)) return true;
  if(/^(source|source evidence|key points|summary|overview|details|connections)$/i.test(s)) return true;
  if(s.length < 2) return true;
  return false;
}

function highlightSentence(sentence){
  return intelligentHighlightSentence(sentence);
}

function highlightCategoryForText(text){
  const clean = (text||'').replace(/\s+/g,' ').trim();
  const low = clean.toLowerCase();
  const blocked = ['source','source evidence','key points','summary','overview','connections','related notes','details','more'];
  if(!clean || clean.split(/\s+/).length < 5 || blocked.includes(low)) return null;
  if(/^source\b|source evidence|key points|connections|related section/i.test(clean)) return null;
  if(/\b(wrong|except|however|unless|do not|not |misunderstand|mistake|warning|but)\b/i.test(clean)) return 'warning';
  if(/\b(is|are|means|refers to|called|defined as)\b/i.test(clean)) return 'definition';
  if(/\b(first|then|next|finally|stage|step|process|cycle|moves through|breaks down|absorbed|passes through)\b/i.test(clean)) return 'process';
  if(/\b(for example|such as|including|like|e\.g\.)\b/i.test(clean)) return 'example';
  if(/\b(because|therefore|so that|leads to|results in|causes|needed to|used for|must|can be used|equals|yields|greater than|less than|1[5-9]\d{2}|20\d{2}|\d+)\b/i.test(clean)) return 'fact';
  return clean.split(/\s+/).length >= 9 ? 'fact' : null;
}

function highlightImportance(text, category){
  const simple = conciseSummary ? conciseSummary(text, 18) : (text||'').split(/\s+/).slice(0,18).join(' ');
  const why = {
    definition:'This is important because it defines a key concept you need before answering questions on this topic.',
    fact:'This is an important fact or conclusion that is likely to be useful in revision or a quiz.',
    example:'This example helps explain how the concept works in the source material.',
    warning:'This is worth noticing because it marks an exception, contrast, or common mistake.',
    process:'This describes a step, sequence, or process that is useful for understanding how the topic works.'
  }[category] || 'This point is useful for revision.';
  const quiz = {
    definition:`Which option best explains this idea: ${simple}?`,
    fact:`Which statement is accurate about this point?`,
    example:`Which example supports this concept?`,
    warning:`What common mistake should you avoid here?`,
    process:`What happens in this step of the process?`
  }[category] || 'What should you remember about this point?';
  return {why, simple, connection:'It connects to the note topic because it explains, supports, or applies one of the main ideas in this section.', quiz};
}

function intelligentHighlightSentence(sentence, categoryOverride){
  const text = plainText(sentence);
  const category = categoryOverride || highlightCategoryForText(text);
  if(!category) return escapeHtml(text);
  const phrases = extractHighlightPhrases(text, category).slice(0,4);
  if(!phrases.length) return escapeHtml(text);
  let html = '';
  let pos = 0;
  phrases.sort((a,b)=>a.start-b.start).forEach(item=>{
    if(item.start < pos) return;
    html += escapeHtml(text.slice(pos,item.start));
    const phrase = text.slice(item.start,item.end);
    const info = highlightImportance(phrase, item.category || category);
    const id = uid('hl');
    html += `<button class="study-highlight ${item.category || category}" data-hl-id="${id}" onclick="openHighlightInfo(event,'${id}','${item.category || category}','${encodeURIComponent(phrase)}','${encodeURIComponent(info.why)}','${encodeURIComponent(info.simple)}','${encodeURIComponent('This key phrase supports the full source sentence: ' + text)}','${encodeURIComponent(info.quiz)}')">${escapeHtml(phrase)}</button>`;
    pos = item.end;
  });
  html += escapeHtml(text.slice(pos));
  return html;
}

function extractHighlightPhrases(text, fallbackCategory){
  const blocked = /\b(source|source evidence|key points|summary|overview|connections|details|evidence)\b/i;
  const patterns = [
    {category:'definition', re:/\b([A-Za-z][A-Za-z-]*(?:\s+[A-Za-z][A-Za-z-]*){0,3})\s+(?:is|are|means|refers to|is called|are called|defined as)\b/gi, group:1},
    {category:'fact', re:/\blarge insoluble(?: food)? molecules?\b/gi},
    {category:'fact', re:/\bsmall soluble(?: food)? molecules?\b/gi},
    {category:'process', re:/\bdigestive enzymes?\b/gi},
    {category:'process', re:/\babsorb(?:ed|ed into|ption)?\b/gi},
    {category:'fact', re:/\bsmall intestine\b/gi},
    {category:'fact', re:/\brespiration\b/gi},
    {category:'fact', re:/\bgrowth(?: and tissue repair)?\b/gi},
    {category:'fact', re:/\btissue repair\b/gi},
    {category:'process', re:/\b[A-Za-z][A-Za-z-]*(?:\s+[A-Za-z][A-Za-z-]*){0,2}\s+(?:breaks down|break down|is absorbed|are absorbed|passes through|enter(?:s)? the bloodstream|causes|results in|leads to)\b/gi},
    {category:'example', re:/\b(?:such as|including|for example)\s+([A-Za-z0-9][A-Za-z0-9%+\-]*(?:\s+[A-Za-z0-9][A-Za-z0-9%+\-]*){0,5})/gi, group:1},
    {category:'fact', re:/\b(?:[A-Z][a-z]{2,}(?:\s+[A-Z][a-z]{2,}){0,2}|[a-zA-Z]+\s*=\s*[^,.;]+|\d+(?:\.\d+)?%?|\b1[5-9]\d{2}\b|\b20\d{2}\b)\b/g}
  ];
  const out = [];
  patterns.forEach(p=>{
    let m;
    p.re.lastIndex = 0;
    while((m = p.re.exec(text))){
      const phrase = p.group ? m[p.group] : m[0];
      const start = p.group ? m.index + m[0].indexOf(phrase) : m.index;
      const end = start + phrase.length;
      const clean = phrase.trim();
      if(clean.length < 4 || clean.split(/\s+/).length > 6 || blocked.test(clean)) continue;
      if(out.some(x=>!(end<=x.start || start>=x.end))) continue;
      out.push({start,end,category:p.category});
    }
  });
  if(!out.length && fallbackCategory){
    const terms = extractKeyTerms(text,3).filter(t=>!blocked.test(t) && t.split(/\s+/).length<=4);
    terms.forEach(term=>{
      const start = text.toLowerCase().indexOf(term.toLowerCase());
      if(start >= 0) out.push({start,end:start+term.length,category:fallbackCategory});
    });
  }
  return out;
}

function plainText(html){
  const div = document.createElement('div');
  div.innerHTML = html || '';
  return div.textContent || div.innerText || '';
}

function uniqueSentences(sentences){
  const seen = new Set();
  return sentences.filter(s=>{
    const key = s.toLowerCase().replace(/[^\w\s]/g,'').replace(/\s+/g,' ').trim();
    if(!key || seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function extractKeyTerms(text, limit=10){
  const freq = {};
  const candidates = text.match(/\b[A-Z][A-Za-z0-9%\-]{2,}(?:\s+[A-Z][A-Za-z0-9%\-]{2,}){0,2}\b/g) || [];
  candidates.forEach(term=>{
    const clean = term.trim().replace(/[.,;:!?]+$/,'');
    if(STOP_WORDS.has(clean) || clean.length < 3) return;
    freq[clean] = (freq[clean]||0)+1;
  });
  const fallback = text.match(/\b[a-zA-Z][a-zA-Z\-]{6,}\b/g) || [];
  fallback.forEach(term=>{
    const clean = term[0].toUpperCase() + term.slice(1).toLowerCase();
    if(STOP_WORDS.has(clean)) return;
    freq[clean] = (freq[clean]||0)+0.3;
  });
  return Object.keys(freq).sort((a,b)=>freq[b]-freq[a] || a.localeCompare(b)).slice(0,limit);
}

function classifySentence(sentence){
  return SECTION_DEFS.find(def=>def.test.test(sentence)) || SECTION_DEFS[SECTION_DEFS.length-1];
}

function sourceTitleFromText(text){
  return (splitSentences(text)[0] || 'Typed source').split(/\s+/).slice(0,6).join(' ');
}

function createSource(title, text, fileType){
  return {
    id: uid('src'),
    title: title || sourceTitleFromText(text),
    fileName: title || 'Typed source',
    fileType: fileType || 'text',
    text,
    uploadedAt: new Date().toLocaleDateString(undefined,{month:'short',day:'numeric'}),
    relatedSectionIds:[],
    relatedNodeIds:[]
  };
}

function organizeListStyleNotes(title, sources, previous, keyTerms){
  const lines = sources.flatMap(src=>src.text.split(/\n+/).map(line=>({text:cleanSourceLine(line), sourceId:src.id}))).filter(x=>!isBadNoteFragment(x.text));
  const lowAll = lines.map(x=>x.text.toLowerCase()).join(' ');
  if(!/(carbohydrates|proteins|fats|vitamins|fibre|mineral salts|digestive)/i.test(lowAll)) return null;
  const srcIds = [...new Set(lines.map(x=>x.sourceId))];
  const prev = previous && previous.sections ? previous.sections.find(s=>s.kind==='nutrients' || /nutrient/i.test(s.title)) : null;
  const nutrientMain = ['carbohydrates','proteins','fats'].filter(term=>lowAll.includes(term));
  const bodyNeeds = ['vitamins','water','fibre','mineral salts'].filter(term=>lowAll.includes(term));
  const bullets = [];
  if(nutrientMain.length){
    bullets.push('The three main nutrient groups are:');
    nutrientMain.forEach(x=>bullets.push(x));
  }
  if(bodyNeeds.length){
    bullets.push('The body also needs:');
    bodyNeeds.forEach(x=>bullets.push(x));
  }
  const extra = lines.map(x=>x.text).filter(t=>{
    const low = t.toLowerCase();
    if(nutrientMain.includes(low) || bodyNeeds.includes(low)) return false;
    if(/the three main nutrient groups/i.test(t) || /the body also needs/i.test(t)) return false;
    return !isBadNoteFragment(t);
  });
  extra.forEach(t=>{ if(!bullets.some(b=>b.toLowerCase()===t.toLowerCase())) bullets.push(t); });
  if(!bullets.length) return null;
  const section = {
    id: prev ? prev.id : uid('sec'),
    nodeId: prev ? prev.nodeId : uid('node'),
    title:'Nutrients',
    kind:'nutrients',
    overview:'The digestive system topic includes the main nutrient groups and other substances the body needs.',
    bullets:bullets.map(escapeHtml),
    bulletSourceIds:bullets.map(()=>srcIds),
    sourceIds:srcIds,
    collapsed: prev ? !!prev.collapsed : false,
    manualEdited: prev ? !!prev.manualEdited : false,
    manualTitle: prev ? !!prev.manualTitle : false,
    manualHighlights: prev ? (prev.manualHighlights || []) : []
  };
  sources.forEach(src=>{ src.relatedSectionIds = [section.id]; src.relatedNodeIds = [section.nodeId]; });
  const overview = 'Topic: Digestive system. The notes identify the main nutrient groups and other substances needed by the body.';
  const remember = bullets.filter(b=>!/:$/.test(b)).slice(0,8);
  return { title, overview, sections:[section], keyTerms:uniqueSentences([...keyTerms, ...nutrientMain, ...bodyNeeds]).slice(0,12), remember, structuredVersion:4, complete:true };
}

function organizeSources(title, sources, previous){
  const allText = sources.map(s=>s.text).join('\n');
  const keyTerms = extractKeyTerms(allText);
  const listStructured = organizeListStyleNotes(title, sources, previous, keyTerms);
  if(listStructured) return listStructured;
  const orderedEntries = [];
  const orderedSeen = new Set();
  sources.forEach(src=>{
    splitSentences(src.text).forEach(sentence=>{
      const clean = sentence.trim();
      const key = clean.toLowerCase().replace(/[^\w\s]/g,'').replace(/\s+/g,' ').trim();
      if(!key || orderedSeen.has(key)) return;
      orderedSeen.add(key);
      orderedEntries.push({text:clean, sourceId:src.id});
    });
  });
  if(orderedEntries.length > 9){
    const chunks = [];
    for(let i=0;i<orderedEntries.length;i+=10) chunks.push(orderedEntries.slice(i,i+10));
    const sections = chunks.map((chunk,i)=>{
      const prev = previous && previous.sections ? previous.sections.find(s=>s.title===`Source notes ${i+1}` || s.pageIndex===i) : null;
      const sourceIds = [...new Set(chunk.map(x=>x.sourceId))];
      const bullets = chunk.map(item=>escapeHtml(item.text));
      const bulletSourceIds = chunk.map(item=>[item.sourceId]);
      return {
        id: prev ? prev.id : uid('sec'),
        nodeId: prev ? prev.nodeId : uid('node'),
        title:`Source notes ${i+1}`,
        kind:'source',
        pageIndex:i,
        overview: plainText(bullets[0] || ''),
        bullets: prev && prev.manualEdited ? prev.bullets : bullets,
        bulletSourceIds: prev && prev.manualEdited ? (prev.bulletSourceIds || prev.bullets.map(()=>sourceIds)) : bulletSourceIds,
        sourceIds,
        collapsed: prev ? !!prev.collapsed : false,
        manualEdited: prev ? !!prev.manualEdited : false,
        manualTitle: prev ? !!prev.manualTitle : false,
        manualHighlights: prev ? (prev.manualHighlights || []) : []
      };
    });
    sources.forEach(src=>{
      src.relatedSectionIds = sections.filter(sec=>sec.sourceIds.includes(src.id)).map(sec=>sec.id);
      src.relatedNodeIds = sections.filter(sec=>sec.sourceIds.includes(src.id)).map(sec=>sec.nodeId);
    });
    const overview = orderedEntries.slice(0,3).map(x=>x.text).join(' ');
    const remember = orderedEntries.filter(x=>highlightCategoryForText(x.text)).slice(0,8).map(x=>x.text);
    return { title, overview, sections, keyTerms, remember, structuredVersion:4, complete:true };
  }
  const grouped = {};
  SECTION_DEFS.forEach(def=>{ grouped[def.kind] = { title:def.title, kind:def.kind, bullets:[], sourceIds:new Set() }; });
  sources.forEach(src=>{
    uniqueSentences(splitSentences(src.text)).forEach(sentence=>{
      const def = classifySentence(sentence);
      grouped[def.kind].bullets.push({ text:sentence, sourceId:src.id });
      grouped[def.kind].sourceIds.add(src.id);
    });
  });
  const sections = Object.values(grouped).filter(g=>g.bullets.length).map(g=>{
    const prev = previous && previous.sections ? previous.sections.find(s=>s.kind===g.kind || s.title===g.title) : null;
    const id = prev ? prev.id : uid('sec');
    const sourceIds = [...g.sourceIds];
    const merged = new Map();
    g.bullets.forEach(b=>{
      const key = b.text.toLowerCase().replace(/[^\w\s]/g,'').replace(/\s+/g,' ').trim();
      if(!key) return;
      if(!merged.has(key)) merged.set(key, {text:b.text, sourceIds:new Set()});
      merged.get(key).sourceIds.add(b.sourceId);
    });
    const entries = [...merged.values()];
    const bullets = entries.map(item=>escapeHtml(item.text));
    const bulletSourceIds = entries.map(item=>[...item.sourceIds]);
    return {
      id,
      nodeId: prev ? prev.nodeId : uid('node'),
      title: prev && prev.manualTitle ? prev.title : g.title,
      kind:g.kind,
      overview: bullets.length ? plainText(bullets[0]) : '',
      bullets: prev && prev.manualEdited ? prev.bullets : bullets,
      bulletSourceIds: prev && prev.manualEdited ? (prev.bulletSourceIds || prev.bullets.map(()=>sourceIds)) : bulletSourceIds,
      sourceIds,
      collapsed: prev ? !!prev.collapsed : false,
      manualEdited: prev ? !!prev.manualEdited : false,
      manualTitle: prev ? !!prev.manualTitle : false,
      manualHighlights: prev ? (prev.manualHighlights || []) : []
    };
  });
  sources.forEach(src=>{
    src.relatedSectionIds = sections.filter(sec=>sec.sourceIds.includes(src.id)).map(sec=>sec.id);
    src.relatedNodeIds = sections.filter(sec=>sec.sourceIds.includes(src.id)).map(sec=>sec.nodeId);
  });
  const overview = uniqueSentences(splitSentences(allText)).slice(0,3).join(' ');
  const remember = sections.flatMap(sec=>sec.bullets.map(plainText)).filter(s=>highlightCategoryForText(s)).slice(0,8);
  return { title, overview, sections, keyTerms, remember, structuredVersion:4, complete:true };
}

function normalizeNote(n){
  if(!n.sources){
    n.sources = [createSource(n.title || 'Original note', n.raw || (n.bullets||[]).map(plainText).join(' '), 'text')];
  }
  if(!n.structured){
    n.structured = organizeSources(n.title, n.sources);
    n.tags = n.structured.keyTerms.slice(0,3);
    n.bullets = n.structured.sections.flatMap(sec=>sec.bullets);
  }
  if(n.sources && n.structured && n.structured.structuredVersion !== 4){
    n.structured = organizeSources(n.title, n.sources, n.structured);
    n.tags = n.structured.keyTerms.slice(0,3);
    n.bullets = n.structured.sections.flatMap(sec=>sec.bullets);
  }
  n.structured.sections.forEach(sec=>{
    if(!sec.bulletSourceIds) sec.bulletSourceIds = sec.bullets.map(()=>sec.sourceIds || []);
    sec.manualHighlights = sec.manualHighlights || [];
  });
  n.raw = n.sources.map(s=>s.text).join('\n\n');
  return n;
}

function ensureStructuredData(){
  ensureRewardsState();
  state.tasks = state.tasks || [];
  state.notes.forEach(normalizeNote);
  syncSubjectCollections();
  state.mindmaps = state.mindmaps.filter(m=>noteById(m.noteId));
  state.mindmaps.slice().forEach(m=>{ if(!m.nodes) syncMindMapForNote(m.noteId); });
}

function organizeText(raw){
  const text = (raw||'').trim();
  if(!text) return { bullets:[], tags:[] };
  const structured = organizeSources('Untitled', [createSource('Typed source', text, 'text')]);
  return { bullets: structured.sections.flatMap(sec=>sec.bullets), tags: structured.keyTerms.slice(0,3) || ['General'], structured };
}

/* ============================= MIND MAP GENERATOR ============================= */

function nodeTitleFromSentence(text){
  const clean = (text||'').replace(/\s+/g,' ').trim();
  const terms = extractKeyTerms(clean,2);
  if(terms.length) return terms.join(' / ');
  return clean.split(/\s+/).slice(0,8).join(' ');
}

function detectMapNodeType(text, fallback){
  if(/\b(formula|equation|equals|plus|minus|divided|squared|reaction|yields|=|\+)\b/i.test(text)) return 'formula';
  if(/\b(1[5-9]\d{2}|20\d{2}|after|before|began|late|early|century)\b/i.test(text)) return 'date';
  if(/\b(for example|such as|like|including|e\.g\.)\b/i.test(text)) return 'example';
  if(/\b(because|causes|leads to|results in|therefore|so that|effect)\b/i.test(text)) return 'cause/effect';
  if(/\b(whereas|while|compared|similar|different|unlike|greater than|less than)\b/i.test(text)) return 'comparison';
  if(/\b(is|are|means|refers to|called|defined as)\b/i.test(text)) return 'definition';
  return fallback || 'fact';
}

function conciseSummary(text, maxWords=18){
  const words = (text||'').replace(/\s+/g,' ').trim().split(/\s+/).filter(Boolean);
  return words.length > maxWords ? words.slice(0,maxWords).join(' ') + '...' : words.join(' ');
}

function sourceNames(note, ids){
  const byId = Object.fromEntries((note.sources||[]).map(s=>[s.id,s]));
  return (ids||[]).map(id=>byId[id]).filter(Boolean).map(s=>s.fileName || s.title);
}

function makeStudyNode(data){
  return Object.assign({keywords:[], points:[], examples:[], definitions:[], relationships:[], steps:[], evidence:[], misconceptions:[], connections:[], sourceIds:[], sourceNames:[], sourceRefs:[], detailedExplanation:[], whyMatters:'', takeaway:''}, data);
}

function makeSourceRefs(note, sec, bulletIndex, ids){
  const names = sourceNames(note, ids || sec.sourceIds || []);
  const passageId = typeof bulletIndex === 'number' && bulletIndex >= 0 ? `${sec.id}-bullet-${bulletIndex}` : sec.id;
  return (ids && ids.length ? ids : (sec.sourceIds || [])).map((id,i)=>({
    sourceId:id,
    sourceName:names[i] || id,
    sectionId:sec.id,
    sectionTitle:sec.title,
    bulletIndex:typeof bulletIndex === 'number' ? bulletIndex : null,
    passageId
  }));
}

function relatedStudyPoints(node, nodes, limit=8){
  const childPoints = nodes.filter(n=>n.parentId===node.id).flatMap(n=>n.points || []);
  const own = [...(node.points||[]), ...(node.definitions||[]), ...(node.examples||[]), ...(node.relationships||[])];
  return uniqueSentences([...own, ...childPoints].filter(Boolean)).slice(0,limit);
}

function sequencePoints(points){
  return points.filter(p=>/\b(first|then|next|after|before|stage|step|cycle|process|occur|occurs|produce|uses|build|turn|changed|began|expanded)\b/i.test(p)).slice(0,6);
}

function evidencePoints(points){
  return points.filter(p=>/\b(1[5-9]\d{2}|20\d{2}|\d+|called|such as|including|for example|equals|yields|greater than|less than)\b/i.test(p)).slice(0,6);
}

function connectionTexts(node, nodes){
  const parent = nodes.find(n=>n.id===node.parentId);
  const children = nodes.filter(n=>n.parentId===node.id).slice(0,5);
  const siblings = parent ? nodes.filter(n=>n.parentId===parent.id && n.id!==node.id).slice(0,4) : [];
  const out = [];
  if(parent) out.push(`${node.title} sits under ${parent.title}, so it should be revised as part of that larger idea.`);
  if(children.length) out.push(`It connects to ${children.map(c=>c.title).join(', ')}.`);
  if(siblings.length) out.push(`Related branches to compare with: ${siblings.map(s=>s.title).join(', ')}.`);
  return out;
}

function misconceptionTexts(node, nodes){
  const out = [];
  const points = node.points || [];
  if(points.some(p=>/\b(greater than|less than|equals|repeated|complex|real)\b/i.test(p))) out.push('Pay attention to the exact condition in the source; changing it can change the conclusion.');
  if(points.some(p=>/\b(occur|occurs|stage|cycle|reaction)\b/i.test(p))) out.push('Do not merge separate stages unless the source says they happen in the same place or do the same job.');
  const siblings = nodes.filter(n=>n.parentId===node.parentId && n.id!==node.id).slice(0,2);
  if(siblings.length && node.parentId) out.push(`Do not confuse this branch with ${siblings.map(s=>s.title).join(' or ')}; the source separates them as different ideas.`);
  return out.slice(0,3);
}

function buildDetailedParagraphs(node, nodes){
  const points = relatedStudyPoints(node,nodes,9);
  const paragraphs = [];
  if(node.description) paragraphs.push(node.description);
  if(points.length > 1) paragraphs.push(points.slice(0,3).join(' '));
  if(points.length > 3) paragraphs.push(points.slice(3,7).join(' '));
  if(node.relationships && node.relationships.length) paragraphs.push(node.relationships.slice(0,3).join(' '));
  return uniqueSentences(paragraphs).filter(Boolean).slice(0,4);
}

function examTakeaway(node){
  const source = (node.points && node.points[0]) || node.description || node.summary || node.title;
  return `${node.title}: ${conciseSummary(source, 24)}`;
}

function enrichStudyNodes(nodes){
  nodes.forEach(node=>{
    if((node.title||'').toLowerCase()==='source evidence') node.title = nodeTitleFromSentence((node.points&&node.points[0]) || node.description || node.summary || 'Evidence');
    if((node.type||'').toLowerCase()==='supporting evidence') node.type = 'evidence';
    const points = relatedStudyPoints(node,nodes,10);
    node.studyLevel = node.parentId ? ((nodes.find(n=>n.id===node.parentId)||{}).studyLevel || 0) + 1 : 0;
    node.steps = uniqueSentences([...(node.steps||[]), ...sequencePoints(points)]).slice(0,6);
    node.evidence = uniqueSentences([...(node.evidence||[]), ...evidencePoints(points)]).slice(0,6);
    node.connections = uniqueSentences([...(node.connections||[]), ...connectionTexts(node,nodes)]).slice(0,5);
    node.misconceptions = uniqueSentences([...(node.misconceptions||[]), ...misconceptionTexts(node,nodes)]).slice(0,3);
    node.detailedExplanation = buildDetailedParagraphs(node,nodes);
    node.whyMatters = node.whyMatters || (node.connections[0] || (points[0] ? `This is important in the study material because it supports the larger topic "${nodes.find(n=>n.id===node.parentId)?.title || node.title}".` : ''));
    node.takeaway = node.takeaway || examTakeaway(node);
  });
}

function buildMindMapFromNote(note){
  normalizeNote(note);
  autoAssignNoteSubject(note);
  const rootId = note.mapRootId || (note.mapRootId = uid('node'));
  const seen = new Set();
  const nodes = [makeStudyNode({
    id:rootId,
    parentId:null,
    sectionId:null,
    type:'root',
    title:note.title,
    summary:conciseSummary(note.structured.overview || note.title, 20),
    description:note.structured.overview || 'This mind map is generated only from the supplied study material.',
    keywords:note.structured.keyTerms || [],
    points:note.structured.remember || [],
    sourceIds:note.sources.map(s=>s.id),
    sourceNames:note.sources.map(s=>s.fileName || s.title),
    sourceRefs:note.structured.sections.flatMap(sec=>makeSourceRefs(note, sec, null, sec.sourceIds)).slice(0,4)
  })];
  note.structured.sections.forEach((sec,sectionIndex)=>{
    const sectionText = sec.bullets.map(plainText).join(' ');
    const sectionKeywords = (note.structured.keyTerms||[]).filter(t=>sectionText.toLowerCase().includes(t.toLowerCase()));
    const sectionPoints = uniqueSentences(sec.bullets.map(plainText)).slice(0,7);
    nodes.push(makeStudyNode({
      id:sec.nodeId,
      parentId:rootId,
      sectionId:sec.id,
      type:sec.kind || 'theme',
      title:sec.title,
      summary:conciseSummary(sec.overview || sectionPoints[0] || sec.title, 18),
      description:sec.overview || sectionPoints[0] || '',
      keywords:sectionKeywords,
      points:sectionPoints,
      definitions:sectionPoints.filter(p=>detectMapNodeType(p)==='definition').slice(0,4),
      examples:sectionPoints.filter(p=>detectMapNodeType(p)==='example').slice(0,4),
      relationships:sectionPoints.filter(p=>['cause/effect','comparison'].includes(detectMapNodeType(p))).slice(0,4),
      sourceIds:sec.sourceIds || [],
      sourceNames:sourceNames(note, sec.sourceIds),
      sourceRefs:makeSourceRefs(note, sec, null, sec.sourceIds)
    }));
    sectionPoints.forEach((point,i)=>{
      const key = point.toLowerCase().replace(/[^\w\s]/g,'').replace(/\s+/g,' ').trim();
      if(!key || seen.has(key)) return;
      seen.add(key);
      const type = detectMapNodeType(point, sec.kind);
      const id = `${sec.nodeId}-detail-${i}`;
      const pointSourceIds = (sec.bulletSourceIds && sec.bulletSourceIds[i]) || sec.sourceIds || [];
      nodes.push(makeStudyNode({
        id,
        parentId:sec.nodeId,
        sectionId:sec.id,
        type,
        title:nodeTitleFromSentence(point),
        summary:conciseSummary(point, 16),
        description:point,
        keywords:extractKeyTerms(point,5),
        points:[point],
        definitions:type==='definition' ? [point] : [],
        examples:type==='example' ? [point] : [],
        relationships:['cause/effect','comparison'].includes(type) ? [point] : [],
        sourceIds:pointSourceIds,
        sourceNames:sourceNames(note, pointSourceIds),
        sourceRefs:makeSourceRefs(note, sec, i, pointSourceIds)
      }));
      extractKeyTerms(point,3).forEach((term,termIndex)=>{
        const termId = `${id}-term-${termIndex}`;
        if(term.length < 4 || nodes.some(n=>n.title.toLowerCase()===term.toLowerCase())) return;
        nodes.push(makeStudyNode({
          id:termId,
          parentId:id,
          sectionId:sec.id,
          type:'key term',
          title:term,
          summary:conciseSummary(point, 12),
          description:`${term} appears in this source point: ${point}`,
          keywords:[term],
          points:[point],
          sourceIds:pointSourceIds,
          sourceNames:sourceNames(note, pointSourceIds),
          sourceRefs:makeSourceRefs(note, sec, i, pointSourceIds)
        }));
      });
      if(/[;,]|\band\b|\bwhich\b|\busing\b|\bfrom\b/i.test(point) && point.split(/\s+/).length > 12){
        nodes.push(makeStudyNode({
          id:`${id}-evidence`,
          parentId:id,
          sectionId:sec.id,
          type:'evidence',
          title:nodeTitleFromSentence(point),
          summary:conciseSummary(point, 14),
          description:point,
          points:[point],
          evidence:[point],
          sourceIds:pointSourceIds,
          sourceNames:sourceNames(note, pointSourceIds),
          sourceRefs:makeSourceRefs(note, sec, i, pointSourceIds)
        }));
      }
    });
  });
  enrichStudyNodes(nodes);
  return { id:'map-'+note.id, noteId:note.id, subjectId:note.subjectId, title:note.title, subtitle:'Detailed study map generated from your organised notes', date:'Today', createdAt:new Date().toISOString(), openedAt:null, revisionVersion:2, nodes, rootId, zoom:0.92, pan:{x:-650,y:-430}, selectedNodeId:rootId, expandedNodeIds:[rootId] };
}

function legacyMindMapToNodes(map){
  const rootId = map.rootId || uid('node');
  const nodes = [makeStudyNode({id:rootId,parentId:null,type:'root',title:map.title,summary:map.subtitle||map.title,description:map.subtitle||map.title,points:[],keywords:[]})];
  (map.branches||[]).forEach(branch=>{
    const branchId = uid('node');
    nodes.push(makeStudyNode({id:branchId,parentId:rootId,type:'theme',title:branch.label,summary:branch.label,description:branch.label,points:branch.children||[]}));
    (branch.children||[]).forEach(child=>nodes.push(makeStudyNode({id:uid('node'),parentId:branchId,type:'fact',title:child,summary:child,description:child,points:[child]})));
  });
  enrichStudyNodes(nodes);
  map.rootId = rootId;
  map.nodes = nodes;
  map.revisionVersion = 2;
  map.selectedNodeId = map.selectedNodeId || rootId;
  map.expandedNodeIds = map.expandedNodeIds || [rootId];
  map.zoom = map.zoom || 0.92;
  map.pan = map.pan || {x:-650,y:-430};
  return map;
}

function syncMindMapForNote(noteId){
  const note = noteById(noteId);
  if(!note) return null;
  const existing = state.mindmaps.find(m=>m.noteId===noteId);
  const next = buildMindMapFromNote(note);
  if(existing){
    const previousManual = Object.fromEntries((existing.nodes||[]).filter(n=>n.manualEdited || n.type==='custom').map(n=>[n.id,n]));
    next.id = existing.id;
    next.zoom = existing.zoom || 0.92;
    next.pan = existing.pan || {x:-650,y:-430};
    next.nodePositions = existing.nodePositions || {};
    next.searchTerm = existing.searchTerm || '';
    next.selectedNodeId = existing.selectedNodeId && next.nodes.some(n=>n.id===existing.selectedNodeId) ? existing.selectedNodeId : next.rootId;
    next.expandedNodeIds = existing.expandedNodeIds && existing.expandedNodeIds.length ? existing.expandedNodeIds.filter(id=>next.nodes.some(n=>n.id===id)) : [next.rootId];
    next.nodes = next.nodes.map(node=>previousManual[node.id] ? Object.assign(node, previousManual[node.id]) : node);
    Object.assign(existing, next);
    return existing;
  }
  state.mindmaps.push(next);
  return next;
}

function px(x,y,w,h,fill){ return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}"/>`; }

function pixelAccessorySVG(name, type){
  if(!name || name==='None') return '';
  let s = '';
  const dark = '#24342b';
  const gold = '#ffd65c';
  const coral = '#ff704d';
  const blue = '#5b8def';
  if(type==='effect'){
    [[22,32],[164,40],[28,174],[170,166],[148,90]].forEach(([x,y],i)=>{
      const c = i%2 ? gold : coral;
      s += px(x,y,6,6,c)+px(x+6,y-6,6,6,c)+px(x+12,y,6,6,c)+px(x+6,y+6,6,6,c);
    });
  }
  if(type==='back'){
    if(/wing/i.test(name)) s += px(24,122,18,18,'#dff5ff')+px(18,140,24,16,'#dff5ff')+px(158,122,18,18,'#dff5ff')+px(158,140,24,16,'#dff5ff');
    else s += px(34,138,24,54,'#3f6b52')+px(40,146,12,12,gold)+px(142,138,24,54,'#3f6b52');
  }
  if(type==='headwear'){
    if(/crown|tiara|graduation/i.test(name)) s += px(64,50,12,16,gold)+px(82,38,12,28,gold)+px(100,48,12,18,gold)+px(118,38,12,28,gold)+px(136,50,12,16,gold)+px(62,66,88,8,gold);
    else if(/headphone/i.test(name)) s += px(48,78,12,34,dark)+px(140,78,12,34,dark)+px(60,54,80,8,dark)+px(42,88,10,18,gold)+px(148,88,10,18,gold);
    else s += px(58,54,84,22,blue)+px(48,72,74,12,blue)+px(120,72,36,8,'#376cc5');
  }
  if(type==='face'){
    if(/glass|monocle/i.test(name)) s += px(66,102,22,8,dark)+px(112,102,22,8,dark)+px(88,106,24,4,dark)+px(70,110,14,4,dark)+px(116,110,14,4,dark);
    if(/blush|freckle|sticker/i.test(name)) s += px(60,118,10,6,'#ee8d8d')+px(130,118,10,6,'#ee8d8d');
    if(/mask/i.test(name)) s += px(72,116,56,16,'#e7f6f0')+px(68,112,8,8,dark)+px(124,112,8,8,dark);
  }
  if(type==='hairAccessory') s += px(128,62,12,12,coral)+px(140,62,12,12,coral)+px(136,58,8,20,gold);
  if(type==='clothing') s += px(78,160,44,8,'rgba(255,255,255,.55)')+px(96,152,8,48,'rgba(36,52,43,.18)');
  if(type==='neck') s += px(76,150,48,8,gold)+px(94,158,12,16,coral);
  if(type==='handheld'){
    if(/book|notebook/i.test(name)) s += px(144,158,34,42,'#fffef8')+px(148,162,4,34,blue)+px(158,168,14,4,'#cfe7d8');
    else if(/controller|camera/i.test(name)) s += px(140,166,40,24,dark)+px(148,172,8,8,gold)+px(166,172,8,8,coral);
    else s += px(146,150,10,48,dark)+px(136,140,30,18,gold);
  }
  if(!type){
    if(name==='Glasses') s += pixelAccessorySVG('Glasses','face');
    if(name==='Headphones') s += pixelAccessorySVG('Headphones','headwear');
    if(name==='Bow') s += pixelAccessorySVG('Bow','hairAccessory');
    if(name==='Cap') s += pixelAccessorySVG('Cap','headwear');
  }
  return s;
}

function chibiPalette(hair, outfit){
  const blue = /Bowl|Soft Bangs|Tousled|Swept|Side Part|Fluffy|Dark|Spider|White|Jeans|Cargo/i.test(hair + ' ' + outfit);
  const pink = /Cat|Pigtail|Pink|Bunny|Twin/i.test(hair + ' ' + outfit);

  return {
    skin:'#fff0e8',

    line: blue ? '#2f4a96' : (pink ? '#9c2f65' : (purple ? '#7b2c73' : '#9b5659')),

    accent: pink ? '#e84670' : (blue ? '#85b9de' : '#d8456f')
  };
}

function navigate(view, id){

function render(){

function fullAvatarProfile(){

function renderMain(){
  const main = document.getElementById('main');
  switch(state.view){

    case 'tasks': main.innerHTML = viewTasks(); break;

}

function streakMilestonesHtml(current){

  return `<div class="streak-milestones" aria-label="${filled} of 7 recent streak milestones">${Array.from({length:7},(_,i)=>`<span class="${i<filled?'on':''}"></span>`).join('')}</div>`;

function emptyState(icon,title,sub){
  return `<div class="card empty-state" style="grid-column:1/-1;"><div class="big">${icon}</div><div style="font-weight:700;font-size:16px;margin-bottom:4px;">${title}</div><div>${sub}</div></div>`;
}

function progressionStats(){
  const points = state.user.points;
  const notes = state.notes.length;
  const maps = state.mindmaps.length;
  const completedTasks = activityEvents().length;
  const tasks = completedTasks;
  const streak = streakInfo().current;
  const info = levelInfo(points);
  const currentLevel = Math.min(info.level, LEVEL_REQUIREMENTS[LEVEL_REQUIREMENTS.length-1].level);
  const next = LEVEL_REQUIREMENTS.find(req=>req.level===currentLevel+1) || null;
  return {points,notes,maps,tasks,completedTasks,streak,currentLevel,next};
}

function missingForRequirement(req, stats){
  if(!req) return [];
  const defs = [
    ['Spark Points', req.points, stats.points],
    ['notes', req.notes, stats.notes],
    ['mind maps', req.maps, stats.maps],
    ['completed tasks', req.tasks, stats.tasks],
    ['day streak', req.streak || 0, stats.streak || 0]
  ];
  return defs.map(([label,need,have])=>({label, need, have, left:Math.max(0, need-have)}));
}

function openLevelPath(){
  const stats = progressionStats();
  const current = LEVEL_REQUIREMENTS.find(req=>req.level===stats.currentLevel) || LEVEL_REQUIREMENTS[0];
  const next = stats.next;
  const missing = missingForRequirement(next, stats).filter(x=>x.left>0);
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this) closeModal()"><div class="modal" style="max-width:760px;">
    <button class="modal-close" onclick="closeModal()">X</button>
    <h2>Level path</h2>
    <p class="sub">Follow the path by creating notes, generating mind maps, and completing study tasks.</p>
    <div class="grid grid-2" style="margin-bottom:18px;">
      <div class="card" style="padding:16px;"><div class="section-kind">Current level</div><h3 style="margin:4px 0 2px;">Level ${current.level}: ${escapeHtml(current.title)}</h3><p style="color:var(--muted);font-size:13px;margin:0;">${stats.points} SP - ${stats.notes} notes - ${stats.maps} maps</p></div>
      <div class="card" style="padding:16px;"><div class="section-kind">Next level</div><h3 style="margin:4px 0 2px;">${next?`Level ${next.level}: ${escapeHtml(next.title)}`:'All levels complete'}</h3><p style="color:var(--muted);font-size:13px;margin:0;">${next ? (missing.length ? missing.map(x=>`${x.left} ${x.label}`).join(' - ') + ' to go' : 'Ready to unlock') : 'You reached the top of this path.'}</p></div>
    </div>
    <div class="level-path">${LEVEL_REQUIREMENTS.map(req=>levelPathRow(req, stats)).join('')}</div>
  </div></div>`;
}

function levelPathRow(req, stats){
  const complete = stats.points>=req.points && stats.notes>=req.notes && stats.maps>=req.maps && stats.tasks>=req.tasks && (stats.streak||0)>=(req.streak||0);
  const current = req.level===stats.currentLevel;
  const cls = complete && !current ? 'complete' : (current ? 'current' : 'locked');
  const missing = missingForRequirement(req, stats);
  const summary = complete ? 'Completed' : (current ? 'Current stage' : 'Locked until all requirements are met');
  return `<div class="level-row ${cls}">
    <div class="level-node">${complete && !current?'OK':(current?'NOW':'LOCK')}</div>
    <div class="level-card">
      <h3>Level ${req.level}: ${escapeHtml(req.title)}</h3>
      <p>${summary}</p>
      <div class="req-list">
        ${missing.map(x=>`<span class="req-chip">${x.have}/${x.need} ${x.label}${x.left>0?` - ${x.left} left`:''}</span>`).join('')}
      </div>
    </div>
  </div>`;
}

function pixelShopIcon(item){
  const type = item.type;
  const name = item.name || '';
  const c = type==='clothing' ? '#5b8def' : (type==='effect' ? '#ffd65c' : (type==='face' ? '#24342b' : (type==='handheld' ? '#ff704d' : '#35a852')));
  let s = `<svg class="pixel-icon" viewBox="0 0 42 42" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">`;
  s += px(2,2,38,38,'#fffef8')+px(4,4,34,34,'#dff5e5');
  if(type==='headwear'){
    if(/crown|tiara/i.test(name)) s += px(8,22,26,6,'#ffd65c')+px(10,14,6,8,'#ffd65c')+px(18,8,6,14,'#ffd65c')+px(26,14,6,8,'#ffd65c');
    else if(/headphone/i.test(name)) s += px(10,18,6,14,'#24342b')+px(26,18,6,14,'#24342b')+px(14,10,14,4,'#24342b');
    else s += px(9,15,24,10,c)+px(6,24,28,6,c);
  }else if(type==='face'){
    s += px(8,18,10,6,c)+px(24,18,10,6,c)+px(18,20,6,3,c);
  }else if(type==='hairAccessory'){
    s += px(8,16,10,10,'#ff704d')+px(24,16,10,10,'#ff704d')+px(18,14,6,14,'#ffd65c');
  }else if(type==='clothing'){
    s += px(12,12,18,6,c)+px(8,18,26,18,c)+px(18,18,6,18,'rgba(255,255,255,.45)');
  }else if(type==='neck'){
    s += px(10,15,22,6,'#ffd65c')+px(16,21,10,12,'#ff704d');
  }else if(type==='handheld'){
    s += px(12,10,18,24,'#fffef8')+px(14,12,4,20,c)+px(21,16,7,4,'#cfe7d8');
  }else if(type==='back'){
    s += px(12,10,18,26,c)+px(16,16,10,8,'#ffd65c');
  }else if(type==='effect'){
    s += px(10,18,6,6,c)+px(16,12,6,6,c)+px(22,18,6,6,c)+px(16,24,6,6,c)+px(30,8,4,4,'#ff704d');
  }else{
    s += px(12,12,18,18,c);
  }
  s += `</svg>`;
  return s;
}

function shopItemHtml(item){
  const owned = item.type==='avatarSet' ? isAvatarSetOwned(item) : state.user.shop.ownedItemIds.includes(item.id);
  const equipped = owned && isShopItemEquipped(item);
  const canBuy = state.user.points >= item.cost;

  const description = SHOP_DESCRIPTIONS[item.name] || item.description;
  const preview = avatarSVG(avatarWithItem(Object.assign({}, state.user.avatar, {gender:state.user.gender}), item));
  return `<div class="shop-item ${!owned && !canBuy?'locked':''}">
    <div class="shop-icon overlay-preview">${preview}</div>
    <div style="flex:1;">
      <h4>${escapeHtml(item.name)}</h4>
      <p>${escapeHtml(description)}</p>
      <div class="shop-cost">${owned?'Owned':item.cost + ' SP'}</div>
      <span class="status-chip ${equipped?'equipped':(owned?'owned':'')}">${status}</span>
    </div>
    <div class="action-row" style="justify-content:flex-end;">
      <button class="btn btn-outline btn-sm" onclick="previewShopItem('${item.id}')">Preview</button>

    </div>
  </div>`;
}

function buyShopItem(itemId){
  ensureRewardsState();
  const item = SHOP_ITEMS.find(x=>x.id===itemId);
  if(!item) return;
  if(item.type==='avatarSet' && isAvatarSetOwned(item)){ toast('Owned already'); openSparkShop('avatarSet'); return; }
  if(item.type!=='avatarSet' && state.user.shop.ownedItemIds.includes(itemId)){ toast('Owned already'); return; }
  if(state.user.points < item.cost){ toast('Not enough SP'); return; }
  pushUndo('buy shop item');
  const beforePoints = state.user.points;
  state.user.points -= item.cost;
  if(item.type==='avatarSet'){
    state.user.ownedAvatarSetIds.push(item.value);
    if(!state.user.shop.ownedItemIds.includes(itemId)) state.user.shop.ownedItemIds.push(itemId);
  }else{
    state.user.shop.ownedItemIds.push(itemId);
  }
  state.user.previewItemId = null;
  if(!saveState()){
    state.user.points = beforePoints;
    if(item.type==='avatarSet') state.user.ownedAvatarSetIds = state.user.ownedAvatarSetIds.filter(id=>id!==item.value);
    state.user.shop.ownedItemIds = state.user.shop.ownedItemIds.filter(id=>id!==itemId);
    toast('Could not save purchase');
    return;
  }
  openSparkShop();
  toast(item.name + ' unlocked');
}

function previewShopItem(itemId){
  const item = SHOP_ITEMS.find(x=>x.id===itemId);
  if(!item) return;
  const profile = avatarWithItem(Object.assign({}, state.user.avatar, {gender:state.user.gender}), item);
  const preview = avatarSVG(profile);
  const owned = item.type==='avatarSet' ? isAvatarSetOwned(item) : state.user.shop.ownedItemIds.includes(item.id);
  const equipped = owned && isShopItemEquipped(item);
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this) closeModal()"><div class="modal" style="max-width:430px;text-align:center;">
    <button class="modal-close" onclick="closeModal()">X</button>

}

function viewSubjects(){

function filterSubjects(q){

function openSubject(id){

function subjectRecentContent(subjectId){

function subjectContentItems(subjectId){

function subjectContentCardHtml(entry){

      </div>
      <div class="subject-mini-stats">

function subjectSmallCardHtml(entry){
  return `<div class="card smart-card" onclick="${entry.type==='note'?`openNoteFromSubject('${entry.id}')`:`openMapFromSubject('${entry.id}')`}">
    <div class="smart-top"><div class="smart-icon">${entry.type==='note'?'N':'M'}</div><span class="tag-pill">${entry.type==='note'?'Note':'Mind map'}</span></div>

function setSubjectFilter(id, filter){

  document.querySelectorAll('#subject-filter .seg').forEach(btn=>btn.classList.toggle('active', btn.textContent===filter));
  renderSubjectContent(id);
}
function subjectContentListHtml(id, filter, q, sort){
  let items = subjectContentItems(id);
  if(filter==='Notes') items = items.filter(x=>x.type==='note');
  if(filter==='Mind Maps') items = items.filter(x=>x.type==='map');
  const term = (q||'').toLowerCase();
  if(term) items = items.filter(x=>(x.title+' '+x.subtitle).toLowerCase().includes(term));
  items.sort((a,b)=>{
    if(sort==='title') return a.title.localeCompare(b.title);
    if(sort==='oldest') return contentTimestamp(a.item)-contentTimestamp(b.item);
    return contentTimestamp(b.item)-contentTimestamp(a.item);
  });
  return items.map(subjectContentCardHtml).join('') || emptyState('SUB','Nothing here yet','New matching notes and mind maps will appear here automatically.');
}
function renderSubjectContent(id){
  const list = document.getElementById('subject-content-list');
  if(!list) return;
  const q = document.getElementById('subject-search').value;
  const sort = document.getElementById('subject-sort').value;
  list.innerHTML = subjectContentListHtml(id, window.__subjectFilter || 'All', q, sort);
}
function openNoteFromSubject(id){
  const n = noteById(id);
  if(n) n.openedAt = new Date().toISOString();
  navigate('notes', id);
}
function openMapFromSubject(id){
  const m = mapById(id);
  if(m) m.openedAt = new Date().toISOString();
  navigate('mindmaps', id);
}
function smartReclassifySubject(id){
  pushUndo('recheck subjects');
  state.notes.filter(n=>n.subjectId===id && !n.manualSubject).forEach(n=>autoAssignNoteSubject(n, true));
  state.mindmaps.forEach(m=>{ const n=noteById(m.noteId); if(n) m.subjectId=n.subjectId; });

}

function deleteSubject(id){
  if(!confirm('Remove this subject? Its notes and mind maps will stay in your library.')) return;
  state.subjects = state.subjects.filter(s=>s.id!==id);
  render();

}

  const st = n.structured;
  return `
    <div class="top-row">
      <div>
        <span class="see-all" onclick="navigate('notes')">All notes</span>

      </div>

  `;
}

function noteSectionHtml(note, sec){
  const sourceById = Object.fromEntries(note.sources.map(s=>[s.id,s]));
  const sectionSources = (sec.sourceIds||[]).map(id=>sourceById[id]).filter(Boolean);
  return `<div class="card note-section note-passage" id="section-${sec.id}" data-passage-id="${sec.id}">
    <div class="note-section-head">
      <div>
        <div class="section-kind">${escapeHtml(sec.kind)} ${sec.manualEdited?'<span class="edited-chip">User edited</span>':''}</div>
        <h3>${escapeHtml(sec.title)}</h3>
        ${sectionSources.length?`<div class="citation-row">${sectionSources.map(src=>`<span class="citation-chip">${escapeHtml(src.fileName || src.title)}</span>`).join('')}</div>`:''}
      </div>
      <div class="action-row">
        <button class="btn btn-ghost btn-sm" onclick="toggleSection('${note.id}','${sec.id}')">${sec.collapsed?'Expand':'Collapse'}</button>
        <button class="btn btn-outline btn-sm" onclick="reorganiseSection('${note.id}','${sec.id}')">Reorganise Selected Section</button>
        <button class="btn btn-outline btn-sm" onclick="openManualHighlightModal('${note.id}','${sec.id}')">Highlight text</button>
        <button class="btn btn-outline btn-sm" onclick="openEditSectionModal('${note.id}','${sec.id}')">Edit</button>
      </div>
    </div>
    <div class="section-body ${sec.collapsed?'collapsed':''}">
      <p style="color:var(--muted);margin:0 0 8px;">${escapeHtml(sec.overview || '')}</p>
      ${renderNoteBullets(note,sec)}
    </div>
  </div>`;
}

function renderNoteBullets(note,sec){
  let html = '<ul>';
  sec.bullets.forEach((b,i)=>{
    const text = plainText(b);
    if(isBadNoteFragment(text)) return;
    if(/:$/.test(text)){
      html += `</ul><p class="note-lead note-passage" id="passage-${sec.id}-bullet-${i}" data-passage-id="${sec.id}-bullet-${i}">${renderNoteBullet(note,sec,b,i)}</p><ul>`;
    }else{
      html += `<li class="note-passage" id="passage-${sec.id}-bullet-${i}" data-passage-id="${sec.id}-bullet-${i}">${renderNoteBullet(note,sec,b,i)}</li>`;
    }
  });
  html += '</ul>';
  return html.replace(/<ul><\/ul>/g,'');
}

function renderNoteBullet(note,sec,bullet,index){
  const text = plainText(bullet);
  const manual = (sec.manualHighlights||[]).find(h=>h.index===index && h.text && text.toLowerCase().includes(h.text.toLowerCase()));
  if(manual){
    const pos = text.toLowerCase().indexOf(manual.text.toLowerCase());
    return escapeHtml(text.slice(0,pos)) + intelligentHighlightSentence(text.slice(pos,pos+manual.text.length), manual.category) + escapeHtml(text.slice(pos+manual.text.length));
  }
  return note.autoHighlight === false ? escapeHtml(text) : intelligentHighlightSentence(text);
}

function citationHtml(ids, sourceById){
  const sources = (ids||[]).map(id=>sourceById[id]).filter(Boolean);
  if(!sources.length) return '';
  return `<div class="citation-row">${sources.map(src=>`<span class="citation-chip">${escapeHtml(src.fileName || src.title)}</span>`).join('')}</div>`;
}

function sourceHtml(src){
  return `<div class="source-item"><div class="name">${escapeHtml(src.fileName || src.title)}</div><div class="meta">${escapeHtml(src.fileType || 'text')} - ${src.uploadedAt} - ${src.relatedSectionIds.length} sections</div></div>`;
}

function organiseNote(id){
  const n = noteById(id);
  if(!n) return;
  pushUndo('organise notes');
  normalizeNote(n);
  n.structured = organizeSources(n.title, n.sources, n.structured);
  n.tags = n.structured.keyTerms.slice(0,3);
  syncMindMapForNote(id);
  renderMain();
  toast('Notes organised and synced');
}

function reorganiseSection(noteId, sectionId){
  const n = noteById(noteId);
  if(!n) return;
  normalizeNote(n);
  const section = n.structured.sections.find(s=>s.id===sectionId);
  if(!section) return;
  if(section.manualEdited && !confirm('This section has manual edits. Reorganise it anyway?')) return;
  pushUndo('reorganise section');
  section.bullets = uniqueSentences(section.bullets.map(plainText)).map(highlightSentence);
  section.bulletSourceIds = section.bullets.map(()=>section.sourceIds || []);
  section.manualEdited = true;
  syncMindMapForNote(noteId);
  renderMain();
  toast('Section reorganised');
}

function toggleSection(noteId, sectionId){
  const n = noteById(noteId);
  if(!n) return;
  const sec = n.structured.sections.find(s=>s.id===sectionId);
  if(sec) sec.collapsed = !sec.collapsed;
  renderMain();
}

function toggleAutoHighlights(noteId){
  const n = noteById(noteId);
  if(!n) return;
  pushUndo('toggle note highlights');
  n.autoHighlight = n.autoHighlight === false;
  renderMain();
  toast(n.autoHighlight ? 'Auto-highlight enabled' : 'Auto-highlight disabled');
}

function openHighlightInfo(event,id,category,textEnc,whyEnc,simpleEnc,connectionEnc,quizEnc){
  event.stopPropagation();
  const text = decodeURIComponent(textEnc);
  const why = decodeURIComponent(whyEnc);
  const simple = decodeURIComponent(simpleEnc);

    <div class="section-kind">${escapeHtml(category)} highlight</div>
    <h2>${escapeHtml(text)}</h2>
    <div class="note-detail-body">
      <p><strong>Why this matters:</strong> ${escapeHtml(why)}</p>
      <p><strong>Simpler summary:</strong> ${escapeHtml(simple)}</p>
      <p><strong>Connection:</strong> ${escapeHtml(connection)}</p>
      <p><strong>Possible quiz question:</strong> ${escapeHtml(quiz)}</p>
    </div>
    <div class="highlight-type-row">
      <button onclick="changeVisibleHighlight('${id}','fact')">Fact</button>
      <button onclick="changeVisibleHighlight('${id}','definition')">Definition</button>
      <button onclick="changeVisibleHighlight('${id}','example')">Example</button>
      <button onclick="changeVisibleHighlight('${id}','warning')">Warning</button>
    </div>
    <div class="modal-actions"><button class="btn btn-outline" onclick="removeVisibleHighlight('${id}')">Remove highlight</button><button class="btn btn-accent" onclick="closeModal()">Done</button></div>
  </div></div>`;
}

function changeVisibleHighlight(id,category){
  const el = document.querySelector(`[data-hl-id="${id}"]`);
  if(el){
    el.className = `study-highlight ${category}`;
    toast('Highlight category changed');
  }

}

function removeVisibleHighlight(id){

  if(el){
    const span = document.createElement('span');
    span.textContent = el.textContent;
    el.replaceWith(span);
