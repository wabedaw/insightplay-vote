function openManualHighlightModal(noteId,sectionId){
  const n = noteById(noteId);
  const sec = n && n.structured.sections.find(s=>s.id===sectionId);
  if(!sec) return;
  document.getElementById('modal-root').innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this) closeModal()"><div class="modal">
    <button class="modal-close" onclick="closeModal()">X</button>
    <h2>Manual highlight</h2>
    <p class="page-sub">Type the exact useful phrase or sentence from this section. Interface labels and filler are ignored.</p>
    <div class="field-block"><label class="field-label">Text to highlight</label><textarea class="field" id="manual-highlight-text" rows="4"></textarea></div>
    <div class="field-block"><label class="field-label">Category</label><select class="field" id="manual-highlight-category"><option value="fact">Key fact</option><option value="definition">Definition</option><option value="example">Example</option><option value="warning">Warning or exception</option><option value="process">Process step</option></select></div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-accent" onclick="saveManualHighlight('${noteId}','${sectionId}')">Add highlight</button></div>
  </div></div>`;
}

function saveManualHighlight(noteId,sectionId){
  const n = noteById(noteId);
  const sec = n && n.structured.sections.find(s=>s.id===sectionId);
  if(!sec) return;
  const text = document.getElementById('manual-highlight-text').value.trim();
  const category = document.getElementById('manual-highlight-category').value;
  const low = text.toLowerCase();
  if(!text || text.length < 4 || ['source','source evidence','key points','summary','overview','connections'].includes(low)){ toast('Choose real study content from the note'); return; }
  const index = sec.bullets.findIndex(b=>plainText(b).toLowerCase().includes(text.toLowerCase()));
  if(index < 0){ toast('That text was not found in this section'); return; }
  pushUndo('manual highlight');
  sec.manualHighlights = sec.manualHighlights || [];
  sec.manualHighlights.push({text, category, index});

function pastelForColor(color){
  const c = (color || '#4fbf83').replace('#','');
  const r = parseInt(c.slice(0,2),16), g = parseInt(c.slice(2,4),16), b = parseInt(c.slice(4,6),16);
  return `rgb(${Math.round(r*.12+255*.88)},${Math.round(g*.12+255*.88)},${Math.round(b*.12+255*.88)})`;
}

function selectedBranchIds(map){
  const ids = new Set();
  if(!map || !map.nodes) return ids;
  let node = map.nodes.find(n=>n.id===map.selectedNodeId) || map.nodes.find(n=>n.id===map.rootId);
  while(node){
    ids.add(node.id);
    node = map.nodes.find(n=>n.id===node.parentId);
  }
  const selected = map.nodes.find(n=>n.id===map.selectedNodeId);
  if(selected){
    const stack = [selected.id];
    while(stack.length){
      const id = stack.pop();
      ids.add(id);
      map.nodes.filter(n=>n.parentId===id).forEach(n=>stack.push(n.id));
    }
  }
  return ids;
}

function visibleMapNodes(map){
  if(!map.nodes) legacyMindMapToNodes(map);
  const expanded = new Set(map.expandedNodeIds || [map.rootId]);
  const byParent = {};
  map.nodes.forEach(n=>{ (byParent[n.parentId] || (byParent[n.parentId]=[])).push(n); });
  const out = [];
  function walk(node, depth){
    out.push(Object.assign({}, node, {depth}));
    if(expanded.has(node.id)) (byParent[node.id]||[]).forEach(child=>walk(child, depth+1));
  }
  walk(map.nodes.find(n=>n.id===map.rootId) || map.nodes[0], 0);
  return out;
}

function layoutMap(map){
  if(!map.nodes) legacyMindMapToNodes(map);
  const nodes = visibleMapNodes(map);
  const byParent = {};
  nodes.forEach(n=>{ (byParent[n.parentId] || (byParent[n.parentId]=[])).push(n); });
  const positioned = [];
  const root = nodes.find(n=>n.id===map.rootId);
  const saved = map.nodePositions || {};
  positioned.push(Object.assign({}, root, saved[root.id] || {x:700,y:450}));
  const branches = byParent[map.rootId] || [];
  branches.forEach((branch,i)=>{
    const angle = branches.length===1 ? 0 : (i/(branches.length))*Math.PI*2 - Math.PI/2;
    const bx = 700 + Math.cos(angle)*330;
    const by = 450 + Math.sin(angle)*250;
    positioned.push(Object.assign({}, branch, saved[branch.id] || {x:bx,y:by}));
    const kids = byParent[branch.id] || [];
    kids.forEach((kid,j)=>{
      const spread = Math.min(1.15, Math.max(.34, kids.length*.18));
      const childAngle = angle + (kids.length===1 ? 0 : (j/(kids.length-1)-.5)*spread);
      const autoPos = {x:bx + Math.cos(childAngle)*260, y:by + Math.sin(childAngle)*205};
      positioned.push(Object.assign({}, kid, saved[kid.id] || autoPos));
      const grandKids = byParent[kid.id] || [];
      grandKids.forEach((g,k)=>{
        const gOffset = (k - (grandKids.length-1)/2) * 58;
        const gPos = {x:autoPos.x + Math.cos(childAngle)*210 - Math.sin(childAngle)*gOffset, y:autoPos.y + Math.sin(childAngle)*170 + Math.cos(childAngle)*gOffset};
        positioned.push(Object.assign({}, g, saved[g.id] || gPos));
      });
    });
  });
  return positioned;
}

function mapStageHtml(map){
  const zoom = map.zoom || 1;
  const pan = map.pan || {x:0,y:0};
  const nodes = layoutMap(map);
  const nodeById = Object.fromEntries(nodes.map(n=>[n.id,n]));
  const activeBranch = selectedBranchIds(map);
  const edges = nodes.filter(n=>n.parentId && nodeById[n.parentId]).map(n=>{
    const p = nodeById[n.parentId];
    const dx = Math.abs(n.x-p.x)*.48;
    const c1x = p.x + (n.x>p.x ? dx : -dx);
    const c2x = n.x - (n.x>p.x ? dx : -dx);
    const active = activeBranch.has(n.id) && activeBranch.has(p.id);
    return `<path d="M ${p.x} ${p.y} C ${c1x} ${p.y}, ${c2x} ${n.y}, ${n.x} ${n.y}" fill="none" stroke="${BRANCH_COLORS[n.depth % BRANCH_COLORS.length]}" stroke-width="${active?3:2}" opacity="${active ? '.68' : '.28'}" stroke-linecap="round"/>`;
  }).join('');
  return `<div class="map-stage" style="transform:translate(${pan.x}px,${pan.y}px) scale(${zoom});">
    <svg class="map-edges" width="1400" height="900">${edges}</svg>
    ${nodes.map(n=>mapNodeHtml(map,n)).join('')}
  </div>${mapMiniHtml(nodes)}`;
}

function mapNodeHtml(map,node){
  const hasKids = map.nodes.some(n=>n.parentId===node.id);
  const expanded = (map.expandedNodeIds||[]).includes(node.id);
  const color = BRANCH_COLORS[node.depth % BRANCH_COLORS.length];
  const activeBranch = selectedBranchIds(map);
  const dim = map.selectedNodeId && map.selectedNodeId!==map.rootId && !activeBranch.has(node.id);
  const searchHit = (map.searchTerm||'') && ((node.title||'').toLowerCase().includes(map.searchTerm) || (node.description||'').toLowerCase().includes(map.searchTerm) || (node.summary||'').toLowerCase().includes(map.searchTerm));
  const bg = node.type==='root' ? '#f1fff7' : pastelForColor(color);
  const hasSourceLink = (node.sourceRefs||[]).some(r=>r.sectionId) || node.sectionId;
  return `<div class="map-node ${node.type==='root'?'root':''} ${map.selectedNodeId===node.id?'active':''} ${dim?'dim':''} ${searchHit?'search-hit':''}" style="left:${node.x}px;top:${node.y}px;--node-bg:${bg};--node-border:${color};" onclick="openMapNodeSource('${map.id}','${node.id}')" onpointerdown="startNodeDrag(event,'${map.id}','${node.id}')">
    <span class="node-type">Level ${Math.min((node.studyLevel || node.depth || 0)+1,4)} - ${escapeHtml(node.type || 'node')}</span>
    <span class="node-title">${hasKids?`<span class="toggle" onclick="toggleMapNode(event,'${map.id}','${node.id}')">${expanded?'-':'+'}</span>`:''}${escapeHtml(node.title)}${hasSourceLink?'<span class="node-link-icon" title="Open in notes">↗</span>':''}</span>
    <span class="node-summary">${escapeHtml(node.summary || conciseSummary(node.description || '', 14))}</span>
  </div>`;
}

function mapMiniHtml(nodes){
  return `<div class="map-mini">${nodes.map(n=>`<span class="map-mini-dot" style="left:${(n.x/1400)*100}%;top:${(n.y/900)*100}%;"></span>`).join('')}</div>`;
}

function mapSearchResultsHtml(map){
  const term = (map.searchTerm || '').trim().toLowerCase();
  if(!term) return '';
  const matches = (map.nodes||[]).filter(n=>
    (n.title||'').toLowerCase().includes(term) ||
    (n.summary||'').toLowerCase().includes(term) ||
    (n.description||'').toLowerCase().includes(term) ||
    (n.keywords||[]).some(k=>k.toLowerCase().includes(term)) ||

    ${matches.map(n=>`<button class="map-search-result" onclick="focusMapSearchResult('${map.id}','${n.id}')"><strong>${escapeHtml(n.title)}</strong><span>${escapeHtml(n.summary || conciseSummary(n.description || '', 16))}</span></button>`).join('') || '<div style="color:var(--muted);font-size:13px;">No matching nodes found.</div>'}
  </div>`;
}

function mindMapSvgText(mapId){
  const m = mapById(mapId);
  if(!m) return '';
  const nodes = layoutMap(m);
  const nodeById = Object.fromEntries(nodes.map(n=>[n.id,n]));
  const edges = nodes.filter(n=>n.parentId && nodeById[n.parentId]).map(n=>{
    const p = nodeById[n.parentId];
    const dx = Math.abs(n.x-p.x)*.48;
    const c1x = p.x + (n.x>p.x ? dx : -dx);
    const c2x = n.x - (n.x>p.x ? dx : -dx);
    return `<path d="M ${p.x} ${p.y} C ${c1x} ${p.y}, ${c2x} ${n.y}, ${n.x} ${n.y}" fill="none" stroke="${BRANCH_COLORS[n.depth % BRANCH_COLORS.length]}" stroke-width="2" opacity="0.45" stroke-linecap="round"/>`;
  }).join('');
  const boxes = nodes.map(n=>{
    const w = n.type==='root' ? 220 : 190;
    const h = n.type==='root' ? 86 : 70;
    const fill = n.type==='root' ? '#f1fff7' : pastelForColor(BRANCH_COLORS[n.depth % BRANCH_COLORS.length]);
    const stroke = n.type==='root' ? '#4fbf83' : BRANCH_COLORS[n.depth % BRANCH_COLORS.length];
    return `<g><rect x="${n.x-w/2}" y="${n.y-h/2}" width="${w}" height="${h}" rx="18" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/><text x="${n.x}" y="${n.y-7}" text-anchor="middle" font-family="Nunito,Arial" font-size="${n.type==='root'?16:12}" font-weight="800" fill="#2f2b2f">${escapeHtml(n.title).slice(0,34)}</text><text x="${n.x}" y="${n.y+13}" text-anchor="middle" font-family="Nunito,Arial" font-size="10" font-weight="700" fill="#786f75">${escapeHtml(n.summary||'').slice(0,42)}</text></g>`;
  }).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#f7fcf9"/>${edges}${boxes}</svg>`;
}
function exportMindMapSvg(mapId){
  const m = mapById(mapId);
  if(!m) return;
  downloadText(slugify(m.title)+'-mind-map.svg', mindMapSvgText(mapId), 'image/svg+xml');

function exportMindMapPng(mapId){
  const m = mapById(mapId);
  if(!m) return;

    a.href = canvas.toDataURL('image/png');
    a.click();
    toast('Mind map PNG exported');
  };
  img.onerror = function(){ URL.revokeObjectURL(url); toast('Could not export PNG'); };
  img.src = url;
}

      sourceRefs:concept.sourceRefs || [],
      type:concept.type
    };
  }).filter(q=>q && validateQuizItem(q, source.text));
  const recent = new Set(state.user.lastQuizQuestionIds || []);
  const fresh = candidates.filter(q=>!recent.has(q.id));
  const chosen = (fresh.length >= Math.min(10,candidates.length) ? fresh : candidates).slice(0,10);
  state.user.lastQuizQuestionIds = chosen.map(q=>q.id).slice(-30);
  saveState();
  return chosen;
}
function flashcardPromptForConcept(concept){
  if(concept.type==='definition') return `What does ${concept.topic} mean?`;
  if(concept.type==='cause/effect') return `What cause or effect is linked to ${concept.topic}?`;
  if(concept.type==='sequence') return `What step or process should you remember about ${concept.topic}?`;
  if(concept.type==='comparison') return `How is ${concept.topic} compared in the notes?`;
  if(concept.type==='formula') return `What formula or calculation detail is linked to ${concept.topic}?`;
  if(concept.type==='date') return `What date or event detail is linked to ${concept.topic}?`;
  if(concept.type==='example') return `What example helps explain ${concept.topic}?`;
  return `What should you remember about ${concept.topic}?`;
}
function validateFlashcard(card, sourceText){
  if(!card || !isRealStudyText(card.front,false) || !isRealStudyText(card.back,false)) return false;
  if(/source evidence/i.test(card.front + ' ' + card.back)) return false;
  const answer = stripStudyArtifacts(card.back).replace(/[.!?]$/,'').toLowerCase();
  const source = stripStudyArtifacts(sourceText).toLowerCase();
  return answer.length > 8 && source.includes(answer.slice(0, Math.min(answer.length, 80)));
}
function buildFlashcards(map,node){
  const source = studySourceForMap(map);
  const bank = getStudyConceptBank(map,node);
  const weighted = bank.flatMap(concept=>{
    const id = `card-${map.id}-${sourceFingerprint(source.text)}-${concept.id}`;
    const previous = (window.__flashcardMemory || {})[id];
    const copies = previous==='learning' ? 3 : previous==='known' ? 1 : 2;
    const card = {
      id,
      front:flashcardPromptForConcept(concept),
      back:studyOptionText(concept.statement),
      explanation:`From ${concept.sectionTitle}: ${concept.statement}`,
      topic:concept.topic,
      sourceRefs:concept.sourceRefs || [],
      status:previous || 'new'
    };
    return Array.from({length:copies},()=>card);
  });
  const picked = [];
  shuffleArray(weighted).forEach(card=>{
    if(picked.length >= 15) return;
    if(validateFlashcard(card, source.text) && !picked.some(c=>c.id===card.id)) picked.push(card);
  });
  return picked;
}

  document.getElementById('modal-root').innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this) closeModal()"><div class="modal">

    <div class="grid grid-2">

        ['exam','Exam style','Focus on takeaways, key facts, and likely test points.'],
        ['definitions','Definitions only','Keep terms, formulas, dates, and definitions.'],
        ['examples','Examples only','Keep examples, evidence, and source details.']
      ].map(([mode,title,desc])=>`<button class="card" style="padding:16px;text-align:left;cursor:pointer;" onclick="regenerateBranch('${mapId}','${nodeId}','${mode}')"><h3 style="margin:0 0 4px;font-size:16px;">${title}</h3><p style="margin:0;color:var(--muted);font-size:13px;">${desc}</p></button>`).join('')}
    </div>
  </div></div>`;

function sectionNodesForMode(note, sec, mode){
  const sectionText = sec.bullets.map(plainText).join(' ');
  const sectionKeywords = (note.structured.keyTerms||[]).filter(t=>sectionText.toLowerCase().includes(t.toLowerCase()));
  let sectionPoints = uniqueSentences(sec.bullets.map(plainText));
  if(mode==='simple') sectionPoints = sectionPoints.slice(0,4);
  if(mode==='definitions') sectionPoints = sectionPoints.filter(p=>['definition','formula','date'].includes(detectMapNodeType(p, sec.kind)));
  if(mode==='examples') sectionPoints = sectionPoints.filter(p=>['example','date'].includes(detectMapNodeType(p, sec.kind)) || evidencePoints([p]).length);
  if(mode==='exam') sectionPoints = uniqueSentences([...sectionPoints.filter(p=>/\b(is|are|means|called|equals|greater than|less than|began|produce|uses|causes|results)\b/i.test(p)), ...sectionPoints]).slice(0,7);
  const nodes = [makeStudyNode({
    id:sec.nodeId,
    parentId:note.mapRootId,
    sectionId:sec.id,
    type:mode==='exam' ? 'exam branch' : (sec.kind || 'theme'),
    title:sec.title,
    summary:mode==='exam' ? `Exam focus: ${conciseSummary(sectionPoints[0] || sec.overview || sec.title, 14)}` : conciseSummary(sec.overview || sectionPoints[0] || sec.title, 18),
    description:sec.overview || sectionPoints[0] || '',
    keywords:sectionKeywords,
    points:sectionPoints,
    definitions:sectionPoints.filter(p=>detectMapNodeType(p)==='definition' || detectMapNodeType(p)==='formula' || detectMapNodeType(p)==='date').slice(0,6),
    examples:sectionPoints.filter(p=>detectMapNodeType(p)==='example').slice(0,6),
    relationships:sectionPoints.filter(p=>['cause/effect','comparison'].includes(detectMapNodeType(p))).slice(0,6),
    sourceIds:sec.sourceIds || [],
    sourceNames:sourceNames(note, sec.sourceIds),
    sourceRefs:makeSourceRefs(note, sec, null, sec.sourceIds)
  })];
  sectionPoints.forEach((point,i)=>{
    const originalIndex = sec.bullets.map(plainText).findIndex(p=>p===point);
    const pointSourceIds = (sec.bulletSourceIds && sec.bulletSourceIds[originalIndex]) || sec.sourceIds || [];
    const type = mode==='exam' ? 'exam point' : detectMapNodeType(point, sec.kind);
    const id = `${sec.nodeId}-${mode}-detail-${i}`;
    nodes.push(makeStudyNode({
      id,
      parentId:sec.nodeId,
      sectionId:sec.id,
      type,
      title:mode==='exam' ? `Test point ${i+1}` : nodeTitleFromSentence(point),
      summary:conciseSummary(point, mode==='simple' ? 11 : 16),
      description:point,
      keywords:extractKeyTerms(point,5),
      points:[point],
      definitions:['definition','formula','date'].includes(type) ? [point] : [],
      examples:type==='example' ? [point] : [],
      evidence:evidencePoints([point]),
      relationships:['cause/effect','comparison'].includes(type) ? [point] : [],
      sourceIds:pointSourceIds,
      sourceNames:sourceNames(note, pointSourceIds),
      sourceRefs:makeSourceRefs(note, sec, Math.max(0,originalIndex), pointSourceIds)
    }));
    if(mode==='detail'){
      extractKeyTerms(point,3).forEach((term,termIndex)=>{
        if(term.length < 4) return;
        nodes.push(makeStudyNode({
          id:`${id}-term-${termIndex}`,
          parentId:id,
          sectionId:sec.id,
          type:'key term',
          title:term,
          summary:conciseSummary(point, 12),
          description:`${term} appears in this source point: ${point}`,
          keywords:[term],
          points:[point],
          sourceIds:pointSourceIds,
          sourceNames:sourceNames(note, pointSourceIds),
          sourceRefs:makeSourceRefs(note, sec, Math.max(0,originalIndex), pointSourceIds)
        }));
      });
    }
  });
  enrichStudyNodes(nodes);
  return nodes;
}
function regenerateBranch(mapId,nodeId){
  const mode = arguments[2] || 'detail';
  const m = mapById(mapId);
  const note = m && noteById(m.noteId);
  const node = m && m.nodes.find(n=>n.id===nodeId);
  if(!note || !node || !node.sectionId) return toast('Choose a notes-linked branch');
  pushUndo('regenerate branch');
  const sec = note.structured.sections.find(s=>s.id===node.sectionId);
  if(!sec) return;
  sec.bullets = uniqueSentences(sec.bullets.map(plainText)).map(highlightSentence);
  const remove = new Set([sec.nodeId]);
  let changed = true;
  while(changed){
    changed = false;
    m.nodes.forEach(n=>{ if(remove.has(n.parentId) && !remove.has(n.id)){ remove.add(n.id); changed = true; } });
  }
  m.nodes = m.nodes.filter(n=>!remove.has(n.id));
  const branchNodes = sectionNodesForMode(note, sec, mode);
  m.nodes.push(...branchNodes);
  enrichStudyNodes(m.nodes);
  m.revisionVersion = 2;
  m.selectedNodeId = sec.nodeId;
  m.expandedNodeIds = [...new Set([...(m.expandedNodeIds||[m.rootId]), m.rootId, sec.nodeId])];
  closeModal();
  renderMain();
  toast(`Branch regenerated - ${mode.replace(/^\w/, c=>c.toUpperCase())}`);
}

function taskMatchesFilter(t, filter){
  const today = todayISO();
  if(filter==='Completed') return !!t.completed;
  if(t.completed) return false;
  if(filter==='Today') return t.dueDate===today || !t.dueDate;
  if(filter==='Overdue') return t.dueDate && t.dueDate < today;
  if(filter==='Upcoming') return t.dueDate && t.dueDate > today;
  return true;
}
function filterForTask(t){
  if(t.completed) return 'Completed';
  const today = todayISO();

  return 'Today';
}

function inferTaskLink(title){
  const q = (title||'').toLowerCase();
  const subject = inferSubjectForTask(title);
  if(subject) return {linkType:'subject', linkId:subject.id, subjectId:subject.id};
  const map = state.mindmaps.find(m=>q.includes(m.title.toLowerCase()) || (q.includes('mind map') && m.title.toLowerCase().split(/\s+/).some(w=>w.length>4 && q.includes(w))));
  if(map) return {linkType:'map', linkId:map.id, subjectId:map.subjectId};
  const note = state.notes.find(n=>q.includes(n.title.toLowerCase()) || n.title.toLowerCase().split(/\s+/).some(w=>w.length>4 && q.includes(w)));
  if(note) return {linkType:'note', linkId:note.id, subjectId:note.subjectId};
  const detected = detectSubjectFromText(title, title);
  return detected.subject && detected.subject.id!==UNSORTED_SUBJECT_ID ? {linkType:'subject', linkId:detected.subject.id, subjectId:detected.subject.id} : {linkType:'', linkId:'', subjectId:detected.subject.id};
}
function inferSubjectForTask(title){
  const q = (' ' + (title||'').toLowerCase().replace(/[^a-z0-9 ]+/g,' ') + ' ').replace(/\s+/g,' ');
  const exact = state.subjects.find(s=>{
    if(s.id===UNSORTED_SUBJECT_ID) return false;
    const name = normalSubjectName(s.name);
    return name && new RegExp(`\\b${name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\b`, 'i').test(q);
  });
  if(exact) return exact;
  const aliasRule = SUBJECT_RULES.find(rule=>rule.aliases.some(alias=>new RegExp(`\\b${alias.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\b`, 'i').test(q)));
  if(aliasRule){
    const existing = findSubjectByName(aliasRule.name);
    if(existing) return existing;
  }
  const contentMatch = state.subjects.find(s=>{
    if(s.id===UNSORTED_SUBJECT_ID) return false;
    const terms = state.notes.filter(n=>n.subjectId===s.id).flatMap(n=>(n.tags||[]).concat((n.structured&&n.structured.keyTerms)||[])).filter(term=>String(term).length>3);
    return terms.some(term=>new RegExp(`\\b${String(term).toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\b`, 'i').test(q));
  });
  return contentMatch || null;
}

/* ============================= TASK TIMER ============================= */

function currentTimerTask(){
  return state.activeTimer ? taskById(state.activeTimer.taskId) : null;
}
function updateTimerState(){
  const timer = state.activeTimer;
  if(!timer || timer.status!=='running') return;
  const now = Date.now();
  const elapsed = Math.max(0, Math.floor((now - (timer.lastTickAt || now))/1000));
  if(!elapsed) return;
  timer.remainingSeconds = Math.max(0, (timer.remainingSeconds || 0) - elapsed);
  timer.lastTickAt = now;
  if(timer.remainingSeconds <= 0){
    timer.status = 'finished';
    timer.finishedAt = new Date().toISOString();
  }
}
function activeTimerIsBusy(){
  updateTimerState();
  return state.activeTimer && ['running','paused'].includes(state.activeTimer.status) && state.activeTimer.remainingSeconds > 0;
}
function startTaskTimer(taskId){
  const task = taskById(taskId);
  if(!task) return;
  if(activeTimerIsBusy() && state.activeTimer.taskId !== taskId){
    toast('Finish or pause the current timer first');
    openTimerModal();
    return;
  }
  let minutes = Number(task.studyMinutes||0);
  if(!minutes){
    const input = prompt('How many minutes should this study session be?', '25');
    minutes = clampStudyMinutes(input, 0);
    if(!minutes) return;
    task.studyMinutes = minutes;
  }
  minutes = clampStudyMinutes(minutes);
  task.studyMinutes = minutes;
  pushUndo('start timer');
  state.activeTimer = {taskId, totalSeconds:minutes*60, remainingSeconds:minutes*60, status:'running', startedAt:new Date().toISOString(), lastTickAt:Date.now(), prompted:false};
  saveState();
  renderTimerBar();
  openTimerModal();
  toast('Timer started');
}
function pauseTimer(){
  updateTimerState();
  if(!state.activeTimer) return;
  state.activeTimer.status = 'paused';
  saveState();
  renderTimerBar();
  refreshTimerModal();
}
function resumeTimer(){
  if(!state.activeTimer) return;
  state.activeTimer.status = 'running';
  state.activeTimer.lastTickAt = Date.now();
  saveState();
  renderTimerBar();
  refreshTimerModal();
}
function restartTimer(){
  if(!state.activeTimer) return;
  state.activeTimer.remainingSeconds = state.activeTimer.totalSeconds;
  state.activeTimer.status = 'running';
  state.activeTimer.lastTickAt = Date.now();
  state.activeTimer.prompted = false;
  saveState();
  renderTimerBar();
  refreshTimerModal();
}
function finishTimerSession(){
  updateTimerState();
  if(!state.activeTimer) return;
  state.activeTimer.status = 'finished';
  state.activeTimer.remainingSeconds = 0;
  state.activeTimer.finishedAt = new Date().toISOString();
  saveState();
  renderTimerBar();
  showTimerFinishedModal();
}
function clearTimer(){
  state.activeTimer = null;
  saveState();
  renderTimerBar();
  closeModal();
}
function addTimerMinutes(){
  const timer = state.activeTimer;
  if(!timer) return;
  const input = prompt('Add how many minutes?', '10');
  const minutes = Math.max(1, parseInt(input||'0',10)||0);
  if(!minutes) return;
  timer.totalSeconds += minutes*60;
  timer.remainingSeconds += minutes*60;
  timer.status = 'running';
  timer.lastTickAt = Date.now();
  timer.prompted = false;
  saveState();
  renderTimerBar();
  openTimerModal();
}
function markTimerTaskComplete(){
  const task = currentTimerTask();
  if(task && !task.completed) toggleTask(task.id);
  state.activeTimer = null;
  saveState();
  closeModal();
  render();
}
function notifyTimerFinished(){
  const task = currentTimerTask();
  toast('Timer finished' + (task ? ': ' + task.title : ''));
  try{
    if('Notification' in window && Notification.permission === 'granted'){
      new Notification('Study timer finished', {body: task ? task.title : 'Your study session is done.'});
    }else if('Notification' in window && Notification.permission === 'default'){
      Notification.requestPermission();
    }
  }catch(err){}
}
function renderTimerBar(){
  const root = document.getElementById('timer-root');
  if(!root) return;
  updateTimerState();
  const timer = state.activeTimer;
  const task = currentTimerTask();
  if(!timer || !task || timer.status==='finished'){
    root.innerHTML = '';
    return;
  }
  root.innerHTML = `<div class="timer-bar">
    <div onclick="openTimerModal()" style="cursor:pointer;min-width:0;">
      <div class="name">${escapeHtml(task.title)}</div>
      <div class="mini">${timer.status==='paused'?'Paused':'Studying'} - ${formatDuration(task.studyMinutes)}</div>
    </div>
    <div class="actions">
      <div class="time">${formatTimer(timer.remainingSeconds)}</div>
      <button onclick="openTimerModal()">Open</button>
      <button onclick="${timer.status==='paused'?'resumeTimer()':'pauseTimer()'}">${timer.status==='paused'?'Resume':'Pause'}</button>
    </div>
  </div>`;
}
function timerModalHtml(){
  updateTimerState();
  const timer = state.activeTimer;
  const task = currentTimerTask();
  if(!timer || !task) return '';
  const pct = timer.totalSeconds ? Math.max(0, Math.min(100, (timer.remainingSeconds/timer.totalSeconds)*100)) : 0;
  return `<div class="modal-backdrop" onclick="if(event.target===this) closeModal()"><div class="modal" style="max-width:520px;">
    <button class="modal-close" onclick="closeModal()">X</button>
    <div class="eyebrow">Study timer</div>
    <h2>${escapeHtml(task.title)}</h2>
    <div class="timer-count">${formatTimer(timer.remainingSeconds)}</div>
    <div class="timer-progress"><span style="width:${pct}%"></span></div>
    <p class="sub" style="margin-bottom:14px;">${timer.status==='paused'?'Paused':'Counting down'} - ${formatDuration(task.studyMinutes)}</p>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="pauseTimer()">Pause</button>
      <button class="btn btn-accent" onclick="resumeTimer()">Resume</button>
      <button class="btn btn-outline" onclick="restartTimer()">Restart</button>
      <button class="btn btn-danger" onclick="finishTimerSession()">Finish session</button>
    </div>
  </div></div>`;
}
function openTimerModal(){
  if(!state.activeTimer) return toast('No active timer');
  document.getElementById('modal-root').innerHTML = timerModalHtml();
}
function refreshTimerModal(){
  const root = document.getElementById('modal-root');
  if(root && root.innerHTML.includes('Study timer')) root.innerHTML = timerModalHtml();
}
function showTimerFinishedModal(){
  const timer = state.activeTimer;
  const task = currentTimerTask();
  if(!timer || !task) return;
  timer.prompted = true;
  saveState();
  notifyTimerFinished();
  document.getElementById('modal-root').innerHTML = `<div class="modal-backdrop"><div class="modal" style="max-width:520px;">
    <h2>Timer finished</h2>
    <p class="sub">${escapeHtml(task.title)} is done. What would you like to do next?</p>
    <div class="modal-actions">
      <button class="btn btn-accent" onclick="markTimerTaskComplete()">Mark task completed</button>
      <button class="btn btn-outline" onclick="restartTimer()">Start another session</button>
      <button class="btn btn-outline" onclick="addTimerMinutes()">Add more time</button>
      <button class="btn btn-ghost" onclick="clearTimer()">Dismiss</button>
    </div>
  </div></div>`;
}
function timerTick(){
  const before = state.activeTimer && state.activeTimer.status;
  updateTimerState();
  renderTimerBar();
  refreshTimerModal();
  if(state.activeTimer && state.activeTimer.status==='finished' && before!=='finished' && !state.activeTimer.prompted) showTimerFinishedModal();
  saveState();
}

function activityHeatmapHtml(events){
  const days = statsRangeDays(window.__statsRange || 'Last 30 days');

  return `<div class="heatmap">${days.map(day=>{

  }).join('')}</div>`;

/* ============================= MINI-GAME: CATCH THE STARS ============================= */

function starGameDailyKey(){ return localDateISO(new Date()); }
function starGameRewardForScore(score){
  if(score >= 20) return 2;
  if(score >= 10) return 1;
  return 0;
}
function remainingStarGameRewardCap(){
  ensureRewardsState();
  const key = starGameDailyKey();
  return Math.max(0, 4 - (state.user.starGameRewards[key] || 0));
}
function clearCatchStarsTimers(){
  const game = window.__catchStars;
  if(!game) return;
  if(game.timer){ clearInterval(game.timer); game.timer = null; }
  if(game.messageTimer){ clearTimeout(game.messageTimer); game.messageTimer = null; }
  (game.activeStars || []).forEach(star=>{
    if(star.timeoutId) clearTimeout(star.timeoutId);
    if(star.animationTimeoutId) clearTimeout(star.animationTimeoutId);
  });
  (game.spawnTimeoutIds || []).forEach(id=>clearTimeout(id));
  game.activeStars = [];
  game.spawnTimeoutIds = [];
  const area = document.getElementById('star-game-area');
  if(area) area.innerHTML = '';
}
function openCatchStarsGame(){
  clearCatchStarsTimers();
  window.__catchStars = {
    isPlaying:false,
    score:0,
    timeRemaining:30,
    timeLeft:30,
    running:false,
    claimed:false,
    roundId:Date.now() + '-' + Math.random().toString(36).slice(2),
    nextStarId:1,
    activeStars:[],
    spawnTimeoutIds:[],
    milestones:{},
    timer:null,
    messageTimer:null
  };
  document.getElementById('modal-root').innerHTML = catchStarsModalHtml(false);
  updateCatchStarsBubble("Ready? Let's catch some stars!");
}

function startCatchStarsRound(){
  const game = window.__catchStars;
  if(!game || game.running) return;
  clearCatchStarsTimers();
  game.score = 0;
  game.timeLeft = 30;
  game.timeRemaining = 30;
  game.claimed = false;
  game.roundId = Date.now() + '-' + Math.random().toString(36).slice(2);
  game.nextStarId = 1;
  game.activeStars = [];
  game.spawnTimeoutIds = [];
  game.isPlaying = true;
  game.running = true;
  game.milestones = {};
  updateCatchStarsHud();
  updateCatchStarsBubble('Stars caught: 0');
  const area = document.getElementById('star-game-area');
  if(area) area.innerHTML = '';
  scheduleCatchStarSpawn(0, game.roundId);
  scheduleCatchStarSpawn(220 + Math.random()*180, game.roundId);
  scheduleCatchStarSpawn(480 + Math.random()*260, game.roundId);
  game.timer = setInterval(()=>{
    if(!window.__catchStars || !window.__catchStars.running) return;
    window.__catchStars.timeRemaining -= 1;
    window.__catchStars.timeLeft = window.__catchStars.timeRemaining;
    updateCatchStarsHud();
    if(window.__catchStars.timeRemaining <= 0) finishCatchStarsRound();
  }, 1000);
}
function updateCatchStarsHud(){
  const game = window.__catchStars;
  const scoreEl = document.getElementById('star-score');
  const timeEl = document.getElementById('star-time');
  if(scoreEl) scoreEl.textContent = game ? game.score : 0;
  if(timeEl) timeEl.textContent = game ? Math.max(0, game.timeRemaining ?? game.timeLeft) : 0;
}
function catchStarsTargetCount(){
  const game = window.__catchStars;
  if(!game) return 0;
  if(game.timeRemaining > 20) return 3;
  if(game.timeRemaining > 10) return 4;
  return 5;
}
function catchStarLifetime(){
  const game = window.__catchStars;
  if(!game) return 3000;
  const elapsed = 30 - Math.max(0, game.timeRemaining ?? game.timeLeft ?? 30);
  return elapsed >= 20 ? 1000 + Math.random()*1000 : 3000;
}
function scheduleCatchStarSpawn(delay, roundId){
  const game = window.__catchStars;
  if(!game || !game.running || !game.isPlaying || game.roundId !== roundId) return;
  if(game.activeStars.length + game.spawnTimeoutIds.length >= catchStarsTargetCount()) return;
  let timeoutId = null;
  timeoutId = setTimeout(()=>{
    const current = window.__catchStars;
    if(!current || !current.running || !current.isPlaying || current.roundId !== roundId) return;
    current.spawnTimeoutIds = current.spawnTimeoutIds.filter(id=>id!==timeoutId);
    spawnCatchStar(roundId);
  }, Math.max(0, delay));
  game.spawnTimeoutIds.push(timeoutId);
}
function maintainCatchStarCount(){
  const game = window.__catchStars;
  if(!game || !game.running || !game.isPlaying) return;
  const target = catchStarsTargetCount();
  const pending = game.spawnTimeoutIds.length;
  const needed = Math.max(0, target - game.activeStars.length - pending);
  for(let i=0;i<needed;i++) scheduleCatchStarSpawn(150 + Math.random()*450 + i*120, game.roundId);
}
function generateCatchStarPosition(size, padding){
  const area = document.getElementById('star-game-area');
  const game = window.__catchStars;
  if(!area || !game) return {x:padding,y:padding};
  const box = area.getBoundingClientRect();
  const maxX = Math.max(padding, box.width - size - padding);
  const maxY = Math.max(padding, box.height - size - padding);
  let safest = {x:padding, y:padding, distance:-1};
  for(let attempt=0; attempt<24; attempt++){
    const x = padding + Math.random() * Math.max(1, maxX - padding);
    const y = padding + Math.random() * Math.max(1, maxY - padding);
    const distance = game.activeStars.reduce((min, star)=>Math.min(min, Math.hypot(star.x-x, star.y-y)), Infinity);
    if(distance > size + 10) return {x,y};
    if(distance > safest.distance) safest = {x,y,distance};
  }
  return {x:safest.x, y:safest.y};
}
function spawnCatchStar(roundId){
  const game = window.__catchStars;
  const area = document.getElementById('star-game-area');
  if(!game || !area || !game.running || !game.isPlaying || game.roundId !== roundId) return;
  if(game.activeStars.length >= catchStarsTargetCount()) return;
  const size = 54;
  const padding = 12;
  const pos = generateCatchStarPosition(size, padding);
  const id = 'star-' + game.nextStarId++;
  const lifetime = catchStarLifetime();
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'catch-star';
  btn.id = id;
  btn.dataset.starId = id;
  btn.setAttribute('aria-label','Catch star');
  btn.style.left = `${pos.x}px`;
  btn.style.top = `${pos.y}px`;
  btn.innerHTML = '&#9733;';
  btn.onpointerdown = event => catchStarActivate(id, event);
  btn.onkeydown = event => {
    if(event.key === 'Enter' || event.key === ' ') catchStarActivate(id, event);
  };
  area.appendChild(btn);
  const star = {id, x:pos.x, y:pos.y, createdAt:Date.now(), lifetime, isLocked:false, timeoutId:null};
  star.timeoutId = setTimeout(()=>missCatchStar(id, roundId), lifetime);
  game.activeStars.push(star);
  maintainCatchStarCount();
}
function findCatchStar(id){
  const game = window.__catchStars;
  if(!game) return null;
  return game.activeStars.find(star=>star.id===id);
}
function catchStarActivate(idOrEvent, maybeEvent){
  const id = typeof idOrEvent === 'string' ? idOrEvent : (idOrEvent && idOrEvent.currentTarget && idOrEvent.currentTarget.dataset.starId);
  const event = typeof idOrEvent === 'string' ? maybeEvent : idOrEvent;
  if(event){
    event.preventDefault();
    event.stopPropagation();
  }
  const game = window.__catchStars;
  const star = findCatchStar(id);
  if(!game || !star || !game.running || !game.isPlaying || game.timeRemaining <= 0 || star.isLocked) return;
  star.isLocked = true;
  if(star.timeoutId){ clearTimeout(star.timeoutId); star.timeoutId = null; }
  game.score += 1;
  updateCatchStarsHud();
  const starEl = document.getElementById(star.id);
  if(starEl){
    starEl.disabled = true;
    starEl.classList.add('pop');
  }
  updateCatchStarsMessage();
  star.animationTimeoutId = setTimeout(()=>removeCatchStar(star.id, true, game.roundId), 160);
}
function catchStarClick(event){ catchStarActivate(event); }
function missCatchStar(id, roundId){
  const game = window.__catchStars;
  const star = findCatchStar(id);
  if(!game || !star || game.roundId !== roundId || !game.running || !game.isPlaying) return;
  star.isLocked = true;
  const starEl = document.getElementById(star.id);
  if(starEl) starEl.classList.add('fade');
  star.animationTimeoutId = setTimeout(()=>removeCatchStar(star.id, false, roundId), 180);
}
function removeCatchStar(id, shouldReplace, roundId){
  const game = window.__catchStars;
  if(!game || game.roundId !== roundId) return;
  const star = findCatchStar(id);
  if(!star) return;
  if(star.timeoutId) clearTimeout(star.timeoutId);
  if(star.animationTimeoutId) clearTimeout(star.animationTimeoutId);
  game.activeStars = game.activeStars.filter(item=>item.id!==id);
  const starEl = document.getElementById(id);
  if(starEl) starEl.remove();
  if(shouldReplace && game.running && game.isPlaying) scheduleCatchStarSpawn(150 + Math.random()*450, roundId);
  maintainCatchStarCount();
}
function updateCatchStarsMessage(){
  const game = window.__catchStars;
  if(!game) return;
  const score = game.score;
  const milestones = {1:'You caught your first star!',5:'5 stars! Nice work!',10:'10 stars caught!',15:'You are doing great - 15!',20:'20 stars! Amazing!'};
  if(milestones[score] && !game.milestones[score]){
    game.milestones[score] = true;
    updateCatchStarsBubble(milestones[score], true);
    clearTimeout(game.messageTimer);
    game.messageTimer = setTimeout(()=>updateCatchStarsBubble(`Stars caught: ${game.score}`), 1200);
  }else{
    updateCatchStarsBubble(`Stars caught: ${score}`);
  }
}
function updateCatchStarsBubble(message,bounce){
  const bubble = document.getElementById('star-bubble');
  const helper = document.getElementById('star-helper');
  if(bubble) bubble.textContent = message;
  if(helper && bounce){
    helper.classList.remove('bounce');
    void helper.offsetWidth;
    helper.classList.add('bounce');
  }
}
function finishCatchStarsRound(){
  const game = window.__catchStars;
  if(!game || game.claimed) return;
  game.running = false;
  game.isPlaying = false;
  game.timeRemaining = Math.max(0, game.timeRemaining ?? game.timeLeft);
  game.timeLeft = game.timeRemaining;
  game.locked = true;
  game.isStarLocked = true;
  game.claimed = true;
  clearCatchStarsTimers();
  const baseReward = starGameRewardForScore(game.score);
  const key = starGameDailyKey();
  const award = Math.min(baseReward, remainingStarGameRewardCap());
  if(award > 0){
    state.user.starGameRewards[key] = (state.user.starGameRewards[key] || 0) + award;
    addPoints(award);
    saveState();
    toast(`Catch the Stars complete - +${award} SP`);
  }else if(baseReward > 0){
    toast('Daily mini-game SP limit reached');
  }
  document.getElementById('modal-root').innerHTML = catchStarsModalHtml(true);
  updateCatchStarsBubble(`You caught ${game.score} stars!`, true);
  const star = document.getElementById('catch-star');
  if(star) star.disabled = true;
}

function readFileAsText(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ev=>resolve(ev.target.result);
    reader.onerror = reject;
    reader.readAsText(file);
  });
}
function readFileAsArrayBuffer(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ev=>resolve(ev.target.result);
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}
async function extractPdfText(file){
  if(!window.pdfjsLib) throw new Error('PDF extractor is not available. Check your connection and try again.');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const data = await readFileAsArrayBuffer(file);
  const pdf = await pdfjsLib.getDocument({data}).promise;
  const pages = [];
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    pages.push(content.items.map(item=>item.str).join(' '));
  }
  return pages.join('\n\n');
}
async function extractDocxText(file){
  if(!window.mammoth) throw new Error('DOCX extractor is not available. Check your connection and try again.');
  const arrayBuffer = await readFileAsArrayBuffer(file);
  const result = await mammoth.extractRawText({arrayBuffer});
  return result.value;
}
async function handleNoteFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const status = document.getElementById('file-name');
  status.textContent = 'Extracting text from ' + file.name + '...';
  try{
    let text = '';
    if(['txt','md','markdown'].includes(ext)) text = await readFileAsText(file);
    else if(ext==='pdf') text = await extractPdfText(file);
    else if(ext==='docx') text = await extractDocxText(file);
    else throw new Error('Unsupported file type.');
    if(!text.trim()) throw new Error('No readable text was found in this file.');
    document.getElementById('note-raw').value = text;
    window.__noteFileMeta = {fileName:file.name, fileType:ext};
    if(!document.getElementById('note-title').value){
      document.getElementById('note-title').value = file.name.replace(/\.(txt|md|markdown|pdf|docx)$/i,'');
    }
    status.textContent = 'Selected: ' + file.name + ' - ' + Math.round(text.length/100)/10 + 'k characters extracted';
  }catch(err){
    status.textContent = 'Could not process ' + file.name + ': ' + err.message;
    e.target.value = '';
  }
}

    <p class="sub">Manual edits are preserved when you add more sources later.</p>
    <div class="field-block"><label class="field-label">Heading</label><input class="field" id="edit-section-title" value="${escapeHtml(sec.title)}"/></div>
    <div class="field-block"><label class="field-label">Bullet points</label><textarea class="field" id="edit-section-bullets" rows="9">${escapeHtml(sec.bullets.map(plainText).join('\n'))}</textarea></div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-accent" onclick="saveSectionEdit('${noteId}','${sectionId}')">Save</button></div>
  </div></div>`;
}

function saveSectionEdit(noteId, sectionId){
  const n = noteById(noteId);
  const sec = n && n.structured.sections.find(s=>s.id===sectionId);
  if(!sec) return;
  pushUndo('edit section');
  sec.title = document.getElementById('edit-section-title').value.trim() || sec.title;
  sec.bullets = document.getElementById('edit-section-bullets').value.split(/\n+/).map(s=>s.trim()).filter(Boolean).map(highlightSentence);
  sec.bulletSourceIds = sec.bullets.map(()=>sec.sourceIds || []);
  sec.manualEdited = true;
  sec.manualTitle = true;
  syncMindMapForNote(noteId);
  closeModal();
  renderMain();
  toast('Section saved');
}

function openMindMapPicker(){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <button class="modal-close" onclick="closeModal()">X</button>
        <h2>Choose a note</h2>
        <p class="sub">SparkStudy will read the note and sketch a mind map with branches and key terms.</p>
        <div style="display:flex;flex-direction:column;gap:10px;max-height:50vh;overflow-y:auto;">
          ${state.notes.map(n=>`
            <div class="card" style="padding:14px 16px;cursor:pointer;" onclick="createMindMapFromNote('${n.id}');closeModal();">
              <div style="font-weight:700;">${escapeHtml(n.title)}</div>
              <div style="color:var(--muted);font-size:13px;">${escapeHtml((subjectById(n.subjectId)||{}).name||'General')} - ${n.date}</div>
            </div>`).join('') || '<div style="color:var(--muted);">No notes yet - create one first.</div>'}
        </div>
        <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button></div>
      </div>
    </div>`;
}

/* ============================= INIT ============================= */
render();
window.__timerInterval = setInterval(timerTick, 1000);
</script>
